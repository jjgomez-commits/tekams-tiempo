<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tekams Jump</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>























:root{
  --navy:#2A2963;--navy-dk:#1E1D4A;--navy-lt:#3D3C80;
  --accent:#D94F2B;--accent2:#8B3FA8;
  --bg:#F2F1F8;--surf:#FFFFFF;--surf2:#F7F6FC;
  --bdr:rgba(42,41,99,.08);--bdr-md:rgba(42,41,99,.15);
  --txt:#1A1940;--txt2:#5A5880;--txt3:#9896B8;
  --bl:#2A2963;--bl-lt:#ECEAF8;--bl-mid:#B8B5E8;
  --grn:#1A7A4A;--grn-lt:#E6F5EE;
  --amb:#8A5200;--amb-lt:#FDF2DC;
  --red:#C02020;--red-lt:#FCEAEA;
  --r:10px;--rlg:14px;
  --sh:0 1px 3px rgba(42,41,99,.06),0 4px 16px rgba(42,41,99,.05);
  --sh-md:0 4px 16px rgba(42,41,99,.1),0 12px 40px rgba(42,41,99,.08);
  /* Aliases cortos */
  --nv:#2A2963;--nv-dk:#1E1D4A;--nv-lt:#3D3C80;
  --ac:#D94F2B;--ac2:#8B3FA8;
  --su:#FFFFFF;--su2:#F7F6FC;
  --bd:rgba(42,41,99,.08);--bd-md:rgba(42,41,99,.15);
  --tx:#1A1940;--tx2:#5A5880;--tx3:#9896B8;
  --bl-md:#B8B5E8;
  --gn:#1A7A4A;--gn-lt:#E6F5EE;
  --am:#8A5200;--am-lt:#FDF2DC;
  --rd:#C02020;--rd-lt:#FCEAEA;
  --rl:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:#F2F1F8;color:#1A1940;min-height:100vh;font-size:14px;line-height:1.5}
.shell{display:flex;min-height:100vh}

/* ── SIDEBAR ── */
.sb{width:230px;flex-shrink:0;background:#1E1D4A;display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;z-index:20;overflow-y:auto}
.sb-logo{padding:1.1rem 1.25rem;border-bottom:1px solid rgba(255,255,255,.08);display:flex;align-items:center;justify-content:flex-start}
.sb-logo img{height:28px;width:auto;max-width:150px;object-fit:contain;display:block;mix-blend-mode:normal}
.sb-sec{padding:.6rem 0 .15rem}
.sb-lbl{font-size:9px;font-weight:700;color:rgba(255,255,255,.28);text-transform:uppercase;letter-spacing:.09em;padding:0 1rem;margin-bottom:3px}
.nav-i{display:flex;align-items:center;gap:9px;padding:7px 1rem;font-size:12px;color:rgba(255,255,255,.5);cursor:pointer;border:none;background:none;width:100%;text-align:left;transition:all .15s;font-family:'DM Sans',sans-serif}
.nav-i i{font-size:15px;flex-shrink:0}
.nav-i:hover{background:rgba(255,255,255,.07);color:rgba(255,255,255,.85)}
.nav-i.on{background:rgba(255,255,255,.12);color:#fff;font-weight:600}
.nb{margin-left:auto;font-size:9px;font-family:'DM Mono',monospace;background:rgba(255,255,255,.12);padding:1px 7px;border-radius:20px;color:rgba(255,255,255,.5)}
.nav-i.on .nb{background:rgba(255,255,255,.2);color:#fff}
.nb-red{background:rgba(217,79,43,.8)!important;color:#fff!important}
.proj-nav{display:flex;align-items:center;gap:8px;padding:5px 1rem 5px 1.35rem;font-size:12px;color:rgba(255,255,255,.42);cursor:pointer;border:none;background:none;width:100%;text-align:left;font-family:'DM Sans',sans-serif;transition:all .15s}
.proj-nav:hover{color:rgba(255,255,255,.78);background:rgba(255,255,255,.05)}
.proj-nav.on{color:#fff;font-weight:600;background:rgba(255,255,255,.1)}
.pdot{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.18);flex-shrink:0}
.proj-nav.on .pdot{background:#D94F2B}
.sb-bot{border-top:1px solid rgba(255,255,255,.08);padding:.4rem 0}
.btn-addp{display:flex;align-items:center;gap:6px;margin:.4rem 1rem;padding:6px 10px;border:1px dashed rgba(255,255,255,.16);border-radius:10px;color:rgba(255,255,255,.32);background:none;cursor:pointer;font-size:11px;font-family:'DM Sans',sans-serif;transition:all .15s;width:calc(100% - 2rem)}
.btn-addp:hover{border-color:rgba(255,255,255,.45);color:rgba(255,255,255,.7)}

/* ── MAIN ── */
.main{margin-left:230px;flex:1;padding:1.75rem 2.25rem;min-height:100vh}
.sec{display:none}.sec.on{display:block}
.ph{margin-bottom:1.5rem}
.pt{font-size:20px;font-weight:700;color:#1A1940;letter-spacing:-.02em}
.ps{font-size:12px;color:#5A5880;margin-top:2px}
.row-sb{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap}

/* ── BUTTONS ── */
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:10px;font-size:12px;font-family:'DM Sans',sans-serif;border:1px solid rgba(42,41,99,.15);background:#FFFFFF;color:#1A1940;cursor:pointer;transition:all .15s;font-weight:500}
.btn:hover{background:#F2F1F8}.btn i{font-size:14px}
.btn-sm{padding:4px 9px;font-size:11px;border-radius:8px;border:1px solid rgba(42,41,99,.15);background:#FFFFFF;color:#5A5880;cursor:pointer;font-family:'DM Sans',sans-serif;display:inline-flex;align-items:center;gap:4px;transition:all .15s}
.btn-sm:hover{background:#F2F1F8}

/* ── FILTERS ── */
.filters{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:.875rem}
.fbtn{padding:4px 11px;border-radius:20px;border:1px solid rgba(42,41,99,.15);background:#FFFFFF;font-size:11px;color:#5A5880;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .15s;font-weight:500}
.fbtn:hover{background:#F2F1F8}.fbtn.on{background:#ECEAF8;border-color:var(--bl-mid);color:#2A2963;font-weight:700}
.fsel{padding:4px 9px;border-radius:20px;border:1px solid rgba(42,41,99,.15);background:#FFFFFF;font-size:11px;color:#5A5880;cursor:pointer;font-family:'DM Sans',sans-serif;outline:none}

/* ── TOOL BLOCKS ── */
.tool-block{background:#FFFFFF;border:1px solid rgba(42,41,99,.08);border-radius:14px;margin-bottom:7px;overflow:hidden;box-shadow:0 1px 3px rgba(42,41,99,.06),0 4px 16px rgba(42,41,99,.05);transition:box-shadow .2s}
.tool-block:hover{box-shadow:0 4px 16px rgba(42,41,99,.1),0 12px 40px rgba(42,41,99,.08)}
.tool-hdr{display:grid;grid-template-columns:30px 1fr auto auto auto auto auto;align-items:center;gap:9px;padding:.6rem .875rem;cursor:pointer;transition:background .12s}
.tool-hdr:hover{background:#F7F6FC}
.tool-num{font-size:10px;font-weight:700;color:#fff;background:#2A2963;border-radius:5px;padding:2px 4px;text-align:center;font-family:'DM Mono',monospace;flex-shrink:0}
.tool-name-ed{font-size:13px;font-weight:600;background:none;border:none;color:#1A1940;font-family:'DM Sans',sans-serif;width:100%;outline:none;padding:0;cursor:text}
.tool-name-ed:focus{border-bottom:1.5px solid var(--bl-mid)}
.chev{font-size:14px;color:#9896B8;transition:transform .2s;flex-shrink:0}.chev.open{transform:rotate(180deg)}
.t-actions{display:flex;gap:2px;align-items:center}
.iBtn{background:none;border:none;cursor:pointer;color:#9896B8;padding:3px;border-radius:5px;display:flex;align-items:center;transition:all .12s}
.iBtn:hover{background:#F2F1F8;color:#5A5880}.iBtn i{font-size:13px}
.mprog{width:44px;height:4px;background:#F2F1F8;border-radius:2px;overflow:hidden;flex-shrink:0}
.mfill{height:100%;border-radius:2px;background:#2A2963}.mfill.full{background:#1A7A4A}

/* ── INLINE CONTROLS ── */
.isel{font-size:11px;font-weight:700;border:none;cursor:pointer;font-family:'DM Sans',sans-serif;outline:none;appearance:none;-webkit-appearance:none;border-radius:20px;padding:4px 10px;transition:all .15s;height:28px;vertical-align:middle}
.isel.person{background:#2A2963;color:#fff;min-width:110px;text-align:center;padding:4px 12px;font-size:11px;height:28px;line-height:1.4}.isel.person:hover{background:#3D3C80}
.isel.person.empty{background:rgba(42,41,99,.1);color:#5A5880;font-weight:600;font-size:11px;min-width:110px;text-align:center;padding:4px 12px;height:28px;line-height:1.4}
.isel.status{font-size:9px;text-transform:uppercase;letter-spacing:.04em;font-weight:700}
.isel.s-pend{background:var(--amb-lt);color:var(--amb)}
.isel.s-curso{background:#ECEAF8;color:#2A2963}
.isel.s-done{background:var(--grn-lt);color:#1A7A4A}
.date-wrap{position:relative;display:inline-flex;align-items:center;gap:3px;cursor:pointer}
.date-wrap input[type=date]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;border:none;background:none}
.date-lbl{font-size:10px;color:#9896B8;font-family:'DM Mono',monospace;white-space:nowrap;pointer-events:none}
.date-lbl.late{color:#C02020;font-weight:700}
.date-wrap:hover .date-lbl{color:#2A2963}

/* ── SUBTASKS ── */
.st-list{display:none;border-top:1px solid var(--bdr)}.st-list.open{display:block}
.st-row{display:grid;grid-template-columns:28px 1fr auto auto auto auto auto;align-items:center;gap:7px;padding:.4rem .875rem .4rem 1.2rem;border-bottom:1px solid var(--bdr);transition:background .12s}
.st-row:last-of-type{border-bottom:none}.st-row:hover{background:#F7F6FC}
.chk{width:17px;height:17px;border-radius:50%;border:1.5px solid var(--bdr-md);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .15s}
.chk:hover{border-color:#2A2963}.chk.on{background:#2A2963;border-color:#2A2963}.chk.on i{color:#fff;font-size:9px}
.st-ed{font-size:12px;background:none;border:none;color:#1A1940;font-family:'DM Sans',sans-serif;width:100%;outline:none;padding:0}
.st-ed:focus{border-bottom:1px solid var(--bl-mid)}.st-ed.done{text-decoration:line-through;color:#9896B8}
.add-row{display:flex;gap:5px;padding:.4rem .875rem .4rem 1.2rem;border-top:1px dashed var(--bdr);background:#F7F6FC}
.add-row input{flex:1;font-size:12px;font-family:'DM Sans',sans-serif;padding:4px 8px;border-radius:10px;border:1px solid rgba(42,41,99,.08);background:#FFFFFF;color:#1A1940;outline:none}
.add-row input:focus{border-color:var(--bl-mid)}

/* ── PROJ HEADER ── */
.ph-card{background:#1E1D4A;border-radius:14px;padding:1.1rem 1.4rem;margin-bottom:1.25rem;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
.ph-name{font-size:17px;font-weight:700;color:#fff}
.ph-dates{font-size:11px;color:rgba(255,255,255,.4);font-family:'DM Mono',monospace;margin-top:2px}
.ph-stats{display:flex;gap:16px;align-items:center}.phs-v{font-size:17px;font-weight:700;color:#fff}.phs-l{font-size:9px;color:rgba(255,255,255,.38);text-transform:uppercase;letter-spacing:.05em}
.prog-tr{flex:1;height:4px;background:rgba(255,255,255,.15);border-radius:2px;overflow:hidden}
.prog-fl{height:100%;border-radius:2px;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .5s}

/* ── PROJ TABS ── */
.p-tabs{display:flex;gap:3px;background:#FFFFFF;padding:3px;border-radius:14px;border:1px solid rgba(42,41,99,.08);margin-bottom:1.1rem;width:fit-content}
.ptab{padding:5px 14px;border-radius:10px;border:none;background:none;font-size:12px;font-family:'DM Sans',sans-serif;color:#5A5880;cursor:pointer;font-weight:500;transition:all .15s}
.ptab:hover{background:#F2F1F8}.ptab.on{background:#2A2963;color:#fff}

/* ── DASHBOARD ── */
.dash-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.dc{background:#FFFFFF;border:1px solid rgba(42,41,99,.08);border-radius:14px;padding:1.1rem;box-shadow:0 1px 3px rgba(42,41,99,.06),0 4px 16px rgba(42,41,99,.05)}
.dc-top{background:#1E1D4A;border-radius:10px;padding:.875rem 1rem;margin-bottom:.875rem}
.dc-name{font-size:14px;font-weight:700;color:#fff}.dc-date{font-size:10px;color:rgba(255,255,255,.38);margin-top:2px;font-family:'DM Mono',monospace}
.dc-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-bottom:.875rem}

.dcs-v{font-size:16px;font-weight:700;letter-spacing:-.02em}.dcs-l{font-size:9px;color:#9896B8;margin-top:1px}
.dc-avs{display:flex;gap:3px;flex-wrap:wrap;margin-bottom:.75rem}.av.empty{background:#F2F1F8;color:#9896B8}
.av-c{position:absolute;top:-4px;right:-5px;background:#D94F2B;color:#fff;font-size:8px;border-radius:10px;padding:1px 4px;font-family:'DM Mono',monospace;border:1.5px solid var(--surf);font-weight:700}
.av-c.red{background:#C02020}
.late-sec{border-top:1px solid var(--bdr);padding-top:.625rem}
.late-ttl{font-size:9px;font-weight:700;color:#9896B8;text-transform:uppercase;letter-spacing:.06em;margin-bottom:5px}
.late-it{display:flex;align-items:center;gap:5px;padding:3px 0;border-bottom:1px solid var(--bdr)}
.late-it:last-child{border-bottom:none}
.late-n{font-size:11px;color:#1A1940;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.late-w{font-size:9px;font-weight:700;padding:1px 6px;border-radius:20px;background:#2A2963;color:#fff;white-space:nowrap}
.late-d{font-size:9px;color:#C02020;font-weight:700;font-family:'DM Mono',monospace;white-space:nowrap}
.ok-msg{font-size:11px;color:#1A7A4A;display:flex;align-items:center;gap:5px;padding-top:.625rem;border-top:1px solid var(--bdr)}


/* ── GANTT ── */
.gantt-sc{overflow-x:auto;border-radius:14px;border:1px solid rgba(42,41,99,.08);background:#FFFFFF}
.gt{border-collapse:collapse;font-size:11px;width:100%}
.gt th{font-size:9px;font-weight:700;color:rgba(255,255,255,.7);padding:7px 4px;border-bottom:1px solid rgba(255,255,255,.1);text-align:center;white-space:nowrap;font-family:'DM Mono',monospace;background:#1E1D4A}
.gt th.lh{text-align:left;padding-left:10px;color:#fff;font-size:10px}
.gt td{padding:2px 2px;border-bottom:1px solid var(--bdr);vertical-align:middle;background:#FFFFFF}
.gt tr:hover td{background:#F7F6FC}
.g-lbl{font-size:11px;color:#1A1940;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-left:8px;font-weight:600;max-width:160px}
.g-lbl.sub{color:#9896B8;padding-left:20px;font-size:10px;font-weight:400}
.g-who{text-align:center;padding:2px 4px;white-space:nowrap}
.g-wb{font-size:9px;font-weight:700;padding:2px 7px;border-radius:20px;background:#2A2963;color:#fff;white-space:nowrap}
/* Barras Gantt */
.g-cell{padding:3px 1px;position:relative}
.g-bar{height:18px;border-radius:4px;position:relative;display:flex;align-items:center;overflow:hidden;transition:opacity .15s}
.g-bar:hover{opacity:.85}
.g-bar-label{font-size:9px;font-weight:700;color:rgba(255,255,255,.9);padding:0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
/* Colores por estado real */
.gb-ok{background:linear-gradient(90deg,#3A7BD5,#5A9BF5)}        /* en tiempo */
.gb-done{background:linear-gradient(90deg,#2E9E5A,#4DC97A)}       /* completada */
.gb-late{background:linear-gradient(90deg,#D94F2B,#F5724A)}       /* retrasada */
.gb-ahead{background:linear-gradient(90deg,#8B3FA8,#B06ACC)}      /* adelantada */
.gb-pend{background:rgba(42,41,99,.12);border:1.5px dashed rgba(42,41,99,.2)} /* pendiente sin empezar */
/* Línea hoy */
.today-line{position:absolute;top:0;bottom:0;width:2px;background:#E83A3A;z-index:5;pointer-events:none}
.today-label{position:absolute;top:2px;font-size:8px;font-weight:700;color:#E83A3A;white-space:nowrap;transform:translateX(-50%)}
.g-leg{display:flex;gap:12px;margin-top:.75rem;flex-wrap:wrap;padding:.5rem 0}
.gl-dot{width:12px;height:12px;border-radius:3px;display:inline-block;flex-shrink:0}
/* Mes headers */
.gt th.month{background:#2A2963;font-size:10px;font-weight:700;color:#fff;border-right:1px solid rgba(255,255,255,.15)}
/* Fila grupo */
.gt tr.g-group td{background:#F7F6FC;border-top:1px solid var(--bdr)}
.g-num{font-size:9px;font-weight:700;color:#fff;background:#2A2963;border-radius:4px;padding:1px 4px;margin-right:5px;font-family:'DM Mono',monospace}

/* ── EQUIPO ── */
.team-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:9px}
.mc{background:#FFFFFF;border:1px solid rgba(42,41,99,.08);border-radius:14px;padding:.875rem;box-shadow:0 1px 3px rgba(42,41,99,.06),0 4px 16px rgba(42,41,99,.05)}
.mc-hdr{display:flex;align-items:center;gap:8px;margin-bottom:.5rem}
.mc-av{width:36px;height:36px;border-radius:50%;background:#2A2963;color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.mc-name{font-size:12px;font-weight:700;color:#1A1940}.mc-sub{font-size:10px;color:#9896B8}
.mc-sts{display:flex;flex-direction:column;gap:2px}
.mc-st{font-size:11px;color:#5A5880}.mc-st b{color:#1A1940}.mc-st.red b{color:#C02020}

/* ── NOTIF ── */
.notif-sec{margin-top:1.25rem}
.toast{position:fixed;bottom:22px;right:22px;background:#2A2963;color:#fff;font-size:12px;padding:8px 16px;border-radius:10px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:999;font-family:'DM Sans',sans-serif;box-shadow:0 4px 16px rgba(42,41,99,.1),0 12px 40px rgba(42,41,99,.08)}
.toast.on{opacity:1}

/* ── MODAL ── */
.mo{display:none;position:fixed;inset:0;background:rgba(10,10,30,.5);z-index:100;align-items:center;justify-content:center;padding:1rem}
.mo.on{display:flex}
.md{background:#FFFFFF;border-radius:14px;border:1px solid rgba(42,41,99,.15);padding:1.4rem;width:100%;max-width:430px;max-height:90vh;overflow-y:auto;box-shadow:0 4px 16px rgba(42,41,99,.1),0 12px 40px rgba(42,41,99,.08)}
.md h3{font-size:15px;font-weight:700;margin-bottom:1rem;color:#1A1940}
.fd{margin-bottom:.65rem}
.fd label{display:block;font-size:9px;font-weight:700;color:#5A5880;margin-bottom:3px;text-transform:uppercase;letter-spacing:.05em}
.fd input,.fd select,.fd textarea{width:100%;font-size:12px;font-family:'DM Sans',sans-serif;padding:7px 9px;border-radius:10px;border:1px solid rgba(42,41,99,.15);background:#F2F1F8;color:#1A1940;outline:none}
.fd input:focus,.fd select:focus,.fd textarea:focus{border-color:var(--bl-mid);background:#FFFFFF}
.fd textarea{height:65px;resize:vertical}
.mr{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.empty{text-align:center;padding:2rem;font-size:12px;color:#9896B8}
.empty i{font-size:26px;display:block;margin:0 auto .625rem;opacity:.4}
.cfg-sec{margin-bottom:1.25rem}
.cfg-sec h3{font-size:13px;font-weight:700;color:#1A1940;margin-bottom:.625rem;padding-bottom:.4rem;border-bottom:1px solid var(--bdr)}
.cfg-it{display:flex;align-items:center;justify-content:space-between;padding:.5rem 0;border-bottom:1px solid var(--bdr)}
.cfg-it:last-child{border-bottom:none}
.cfg-lbl{font-size:12px;color:#1A1940}.cfg-sub{font-size:10px;color:#9896B8;margin-top:1px}


/* ── Clases cortas (alias) ── */
.tn{font-size:11px;font-weight:800;color:#fff;background:#2A2963;border-radius:6px;padding:3px 7px;text-align:center;font-family:'DM Mono',monospace;flex-shrink:0;min-width:28px;letter-spacing:.02em}
.tne{font-size:13px;font-weight:600;background:none;border:none;color:#1A1940;font-family:'DM Sans',sans-serif;width:100%;outline:none;padding:0;cursor:text}
.tne:focus{border-bottom:1.5px solid var(--bl-md)}
.tb{background:#FFFFFF;border:1px solid var(--bd);border-radius:var(--rl);margin-bottom:7px;overflow:hidden;box-shadow:0 1px 3px rgba(42,41,99,.06),0 4px 16px rgba(42,41,99,.05);transition:box-shadow .2s}
.tb:hover{box-shadow:0 4px 16px rgba(42,41,99,.1),0 12px 40px rgba(42,41,99,.08)}
.th{display:grid;grid-template-columns:28px 1fr 60px 150px 120px 110px 26px 26px 44px 16px;align-items:center;gap:7px;padding:.6rem .875rem;cursor:pointer;transition:background .12s}
.th:hover{background:#F7F6FC}
.isl{font-size:11px;font-weight:700;border:none;cursor:pointer;font-family:'DM Sans',sans-serif;outline:none;appearance:none;-webkit-appearance:none;border-radius:20px;padding:4px 10px;transition:all .15s;height:28px;vertical-align:middle;box-sizing:border-box}
.isl.per{background:#2A2963;color:#fff;width:150px;text-align:center;text-align-last:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.isl.per:hover{background:var(--nv-lt)}
.isl.per.emp{background:rgba(42,41,99,.08);color:#5A5880;font-weight:600;width:150px}
.isl.sta{font-size:9px;text-transform:uppercase;letter-spacing:.04em;font-weight:700;height:28px;width:120px;text-align:center;text-align-last:center}
.isl.s-pe{background:#FDF2DC;color:#8A5200}.isl.s-cu{background:#ECEAF8;color:#2A2963}.isl.s-do{background:#E6F5EE;color:#1A7A4A}
.dw{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:3px;cursor:pointer;min-height:24px;width:110px;padding:2px 4px;border-radius:4px;box-sizing:border-box}
.dw input[type=date]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;border:none;background:none}
.dl{font-size:10px;color:#9896B8;font-family:'DM Mono',monospace;white-space:nowrap;pointer-events:none}
.dl.late{color:#C02020;font-weight:700}
.dw:hover .dl{color:#2A2963}
.cv{font-size:14px;color:#9896B8;transition:transform .2s;flex-shrink:0}.cv.open{transform:rotate(180deg)}
.ta{display:flex;gap:2px;align-items:center}
.ib{background:none;border:none;cursor:pointer;color:#9896B8;padding:3px;border-radius:5px;display:flex;align-items:center;transition:all .12s}
.ib:hover{background:#F2F1F8;color:#5A5880}.ib i{font-size:13px}
.mp{width:44px;height:4px;background:#F2F1F8;border-radius:2px;overflow:hidden;flex-shrink:0}
.mf{height:100%;border-radius:2px;background:#2A2963}.mf.full{background:var(--gn)}
.stl{display:none;border-top:1px solid var(--bd)}.stl.open{display:block}
.str{display:grid;grid-template-columns:28px 1fr 60px 150px 120px 110px 26px 26px 44px 16px;align-items:center;gap:7px;padding:.4rem .875rem .4rem 1.2rem;border-bottom:1px solid var(--bd);transition:background .12s;overflow:visible}
.str:last-of-type{border-bottom:none}.str:hover{background:#F7F6FC}
.ck{width:17px;height:17px;border-radius:50%;border:1.5px solid var(--bd-md);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .15s}
.ck:hover{border-color:#2A2963}.ck.on{background:#2A2963;border-color:#2A2963}.ck.on i{color:#fff;font-size:9px}
.se{font-size:12px;background:none;border:none;color:#1A1940;font-family:'DM Sans',sans-serif;width:100%;outline:none;padding:0}
.se:focus{border-bottom:1px solid var(--bl-md)}.se.done{text-decoration:line-through;color:#9896B8}
.ar{display:flex;gap:5px;padding:.4rem .875rem .4rem 1.2rem;border-top:1px dashed var(--bd);background:#F7F6FC}
.ar input{flex:1;font-size:12px;font-family:'DM Sans',sans-serif;padding:4px 8px;border-radius:10px;border:1px solid var(--bd);background:#FFFFFF;color:#1A1940;outline:none}
.pn{display:flex;align-items:center;gap:8px;padding:5px 1rem 5px 1.35rem;font-size:12px;color:rgba(255,255,255,.42);cursor:pointer;border:none;background:none;width:100%;text-align:left;font-family:'DM Sans',sans-serif;transition:all .15s}
.pn:hover{color:rgba(255,255,255,.78);background:rgba(255,255,255,.05)}
.pn.on{color:#fff;font-weight:600;background:rgba(255,255,255,.1)}
.pd{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.18);flex-shrink:0}
.pn.on .pd{background:var(--ac)}
.gn2{font-size:9px;font-weight:700;color:#fff;background:#2A2963;border-radius:4px;padding:1px 4px;margin-right:5px;font-family:'DM Mono',monospace}
.gb{height:18px;border-radius:4px;position:relative;display:flex;align-items:center;overflow:hidden}
.gbl{font-size:9px;font-weight:700;color:rgba(255,255,255,.9);padding:0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
.gb-ok{background:linear-gradient(90deg,#3A7BD5,#5A9BF5)}.gb-dn{background:linear-gradient(90deg,#2E9E5A,#4DC97A)}.gb-lt{background:linear-gradient(90deg,#D94F2B,#F5724A)}.gb-pe{background:rgba(42,41,99,.12);border:1.5px dashed rgba(42,41,99,.2)}
.tl{position:absolute;top:0;bottom:0;width:2px;background:#E83A3A;z-index:5;pointer-events:none}
.gg{display:flex;gap:12px;margin-top:.75rem;flex-wrap:wrap;padding:.5rem 0}
.gl{font-size:10px;color:#5A5880;display:flex;align-items:center;gap:5px}
.gld{width:12px;height:12px;border-radius:3px;display:inline-block;flex-shrink:0}
.nc{background:#FFFFFF;border:1px solid var(--bd);border-radius:var(--rl);padding:.875rem;margin-bottom:7px;box-shadow:0 1px 3px rgba(42,41,99,.06),0 4px 16px rgba(42,41,99,.05)}
.nc-who{font-size:12px;font-weight:700;color:#1A1940;margin-bottom:.4rem;display:flex;align-items:center;gap:7px}
.nc-msg{font-size:11px;color:#5A5880;background:#F2F1F8;border-radius:10px;padding:.5rem .625rem;margin-bottom:.625rem}
.notif-sec{margin-top:1.25rem}
.notif-hdr{font-size:12px;font-weight:700;color:#1A1940;margin-bottom:.625rem;display:flex;align-items:center;gap:6px}


/* ── ESTRUCTURA PRINCIPAL ── */
.sb{width:230px;flex-shrink:0;background:#1E1D4A;display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;z-index:20;overflow-y:auto}
.sc{display:none}.sc.on{display:block}
/* ── FILTROS ── */
.flt{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:.875rem}
.fb{padding:4px 11px;border-radius:20px;border:1px solid var(--bd-md);background:#FFFFFF;font-size:11px;color:#5A5880;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .15s;font-weight:500}
.fb:hover{background:#F2F1F8}.fb.on{background:#ECEAF8;border-color:var(--bl-md);color:#2A2963;font-weight:700}
/* ── PESTAÑAS ── */
.pts{display:flex;gap:3px;background:#FFFFFF;padding:3px;border-radius:var(--rl);border:1px solid var(--bd);margin-bottom:1.1rem;width:fit-content}
.pt3{padding:5px 14px;border-radius:10px;border:none;background:none;font-size:12px;font-family:'DM Sans',sans-serif;color:#5A5880;cursor:pointer;font-weight:500;transition:all .15s}
.pt3:hover{background:#F2F1F8}.pt3.on{background:#2A2963;color:#fff}
/* ── DASHBOARD GRID ── */
.dg{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.dct{background:#1E1D4A;border-radius:10px;padding:.875rem 1rem;margin-bottom:.875rem}
.dcn{font-size:14px;font-weight:700;color:#fff}.dcd{font-size:10px;color:rgba(255,255,255,.38);margin-top:2px;font-family:'DM Mono',monospace}

.dc2{background:#F2F1F8;border-radius:10px;padding:.45rem .5rem;text-align:center}
.dc2v{font-size:16px;font-weight:700;letter-spacing:-.02em}.dc2l{font-size:9px;color:#9896B8;margin-top:1px}
.avs{display:flex;gap:3px;flex-wrap:wrap;margin-bottom:.75rem}
.av{width:30px;height:30px;border-radius:50%;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;border:2px solid var(--su);position:relative;cursor:default;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.av.has{background:#2A2963;color:#fff}.av.emp{background:#F2F1F8;color:#9896B8}
.avc{position:absolute;top:-4px;right:-5px;background:var(--ac);color:#fff;font-size:8px;border-radius:10px;padding:1px 4px;font-family:'DM Mono',monospace;border:1.5px solid var(--su);font-weight:700}
.avc.red{background:var(--rd)}
.ls2{border-top:1px solid var(--bd);padding-top:.625rem}
.lt3{font-size:9px;font-weight:700;color:#9896B8;text-transform:uppercase;letter-spacing:.06em;margin-bottom:5px}
.li{display:flex;align-items:center;gap:5px;padding:3px 0;border-bottom:1px solid var(--bd)}
.li:last-child{border-bottom:none}
.ln{font-size:11px;color:#1A1940;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lw2{font-size:9px;font-weight:700;padding:1px 6px;border-radius:20px;background:#2A2963;color:#fff;white-space:nowrap}
.ld{font-size:9px;color:#C02020;font-weight:700;font-family:'DM Mono',monospace;white-space:nowrap}
.ok{font-size:11px;color:#1A7A4A;display:flex;align-items:center;gap:5px;padding-top:.625rem;border-top:1px solid var(--bd)}
/* ── EQUIPO ── */
.tg{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:9px}
.mch{display:flex;align-items:center;gap:8px;margin-bottom:.5rem}
.mca{width:36px;height:36px;border-radius:50%;background:#2A2963;color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.mcn{font-size:12px;font-weight:700;color:#1A1940}.mcs2{font-size:10px;color:#9896B8}
.mcs{display:flex;flex-direction:column;gap:2px}
.mst{font-size:11px;color:#5A5880}.mst b{color:#1A1940}.mst.red b{color:#C02020}
/* ── TOAST ── */
.tst{position:fixed;bottom:22px;right:22px;background:#2A2963;color:#fff;font-size:12px;padding:8px 16px;border-radius:10px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:999;font-family:'DM Sans',sans-serif;box-shadow:0 4px 16px rgba(42,41,99,.1),0 12px 40px rgba(42,41,99,.08)}
.tst.on{opacity:1}
/* ── CFG ── */
.cs{margin-bottom:1.25rem}
.cs h3{font-size:13px;font-weight:700;color:#1A1940;margin-bottom:.625rem;padding-bottom:.4rem;border-bottom:1px solid var(--bd)}
.ci{display:flex;align-items:center;justify-content:space-between;padding:.5rem 0;border-bottom:1px solid var(--bd)}
.ci:last-child{border-bottom:none}
.cl{font-size:12px;color:#1A1940}.cl2{font-size:10px;color:#9896B8;margin-top:1px}
/* ── GANTT ── */
.gsc{overflow-x:auto;border-radius:var(--rl);border:1px solid var(--bd);background:#FFFFFF}

/* ── CLASES FALTANTES ── */
.phc{background:#1E1D4A;border-radius:14px;padding:1.1rem 1.4rem;margin-bottom:1.25rem;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
.phn{font-size:17px;font-weight:700;color:#fff}
.phd{font-size:11px;color:rgba(255,255,255,.4);font-family:'DM Mono',monospace;margin-top:2px}
.phs{display:flex;gap:16px;align-items:center}
.ph2{text-align:center}.ph2v{font-size:17px;font-weight:700;color:#fff}.ph2l{font-size:9px;color:rgba(255,255,255,.38);text-transform:uppercase;letter-spacing:.05em}
.pt2{flex:1;height:4px;background:rgba(255,255,255,.15);border-radius:2px;overflow:hidden}
.pf{height:100%;border-radius:2px;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .5s}
.emp2{text-align:center;padding:2rem;font-size:12px;color:#9896B8}
.emp2 i{font-size:26px;display:block;margin:0 auto .625rem;opacity:.4}
.btn-p{background:#2A2963;color:#fff;border-color:#2A2963}.btn-p:hover{background:#3D3C80}
.btn-d{background:#fff0f0;color:#C02020;border-color:#fcc}.btn-d:hover{background:#ffe0e0}
.pt2-bar{height:4px;background:rgba(255,255,255,.15);border-radius:2px;overflow:hidden;flex:1}

.dcs{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-bottom:.875rem}

.tb[draggable]:active{cursor:grabbing}
.tb.drag-over{border-top:2px solid #2A2963}

    try{var r=localStorage.getItem('tkm9_p');if(r)projs=JSON.parse(r);}catch(e){}
    try{var r=localStorage.getItem('tkm9_d');if(r)pd=JSON.parse(r);}catch(e){}
  }
  try{var r=localStorage.getItem('tkm9_t');if(r)TEAM=JSON.parse(r);}catch(e){}
  if(!projs.length)seed();
  // Reordenar números en caso de datos viejos
  Object.keys(pd).forEach(function(pid){
    if(pd[pid]&&pd[pid].tools)reorderNums(pd[pid].tools);
  });
}
var hasChanges=false;
function save(){
  hasChanges=true;
  try{
    localStorage.setItem('tkm9_p',JSON.stringify(projs));
    localStorage.setItem('tkm9_d',JSON.stringify(pd));
    localStorage.setItem('tkm9_t',JSON.stringify(TEAM));
  }catch(e){
    console.error('No se pudo guardar en este navegador:', e);
    if(!window._storageWarned){
      window._storageWarned=true;
      showToast('Este navegador no esta guardando los cambios. Usa "Guardar" para descargar una copia.');
    }
  }
}
function mkPD(pid){
  return{tools:JUMP.map(function(j){return{
    id:pid+'_'+j.n, num:j.n, name:j.name, person:'', date:'', ganttStart:'',
    status:'Pendiente', notes:'', recurrent:'',
    subtasks:j.sts.map(function(s,i){return{id:pid+'_'+j.n+'_'+i,text:s,person:'',date:'',status:'Pendiente',notes:'',done:false,recurrent:'',link:'',priority:''};})
  };})};
}
function seed(){
  var dd=function(n){var d=new Date();d.setDate(d.getDate()+n);return d.toISOString().split('T')[0];};
  var mo=function(n){var d=new Date();d.setMonth(d.getMonth()+n);return d.toISOString().split('T')[0];};
  projs=[
    {id:'p1',name:'Casaverde',start:mo(-1),end:mo(10),team:['Antonio','Jose','Jon','Puri','Paula']},
    {id:'p2',name:'Ecoplagas', start:mo(0), end:mo(9), team:['JuanJo','Jose','Fran']}
  ];
  pd['p1']=mkPD('p1'); pd['p2']=mkPD('p2');
  save();
}

// ─ HELPERS ─
function proj(id){return projs.find(function(p){return p.id===(id||curP);})||null;}
function pdata(id){return pd[id||curP]||{tools:[]};}
function tStat(t){
  var ss=t.subtasks.map(function(s){return s.status;});
  if(ss.length&&ss.every(function(s){return s==='Completada';}))return'Completada';
  if(ss.some(function(s){return s==='En curso'||s==='Completada';}))return'En curso';
  return t.status||'Pendiente';
}
function tPct(t){
  var ss=t.subtasks||[];
  if(!ss.length)return t.status==='Completada'?100:0;
  return Math.round(ss.filter(function(s){return s.done;}).length/ss.length*100);
}
function ini(n){return String(n||'').split(' ').map(function(w){return w[0];}).join('').slice(0,2).toUpperCase();}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
function fmt(d){return d?new Date(d+'T12:00:00').toLocaleDateString('es-ES',{day:'2-digit',month:'short'}):'--';}
function showToast(msg){var t=document.getElementById('tst');if(!t)return;t.textContent=msg;t.classList.add('on');setTimeout(function(){t.classList.remove('on');},2500);}

function iSS(tid,sid,val){var t=findTool(tid);if(!t)return;var s=t.subtasks.find(function(x){return x.id===sid;});if(!s)return;s.status=val;s.done=val==='Completada';save();renderToolsKeepOpen();renderPH();renderDash();}

// ─ NAV ─
function buildSB(){
  var el=document.getElementById('sbProjs');if(!el)return;
  el.innerHTML='';
  projs.forEach(function(p,idx){
    var btn=document.createElement('button');
    btn.className='pn'+(p.id===curP?' on':'');
    btn.innerHTML='<span class="pd"></span>'+esc(p.name);
    btn.setAttribute('data-pid',p.id);
    btn.draggable=true;

    btn.addEventListener('click',function(){openProj(p.id);});

    btn.addEventListener('dragstart',function(e){
      e.dataTransfer.setData('text/plain',p.id);
      e.dataTransfer.effectAllowed='move';
      btn.style.opacity='0.4';
    });
    btn.addEventListener('dragend',function(){
      btn.style.opacity='1';
      // Limpiar borders de todos
      el.querySelectorAll('.pn').forEach(function(b){b.style.borderTop='';});
    });
    btn.addEventListener('dragover',function(e){
      e.preventDefault();
      e.dataTransfer.dropEffect='move';
      btn.style.borderTop='2px solid rgba(255,255,255,.6)';
    });
    btn.addEventListener('dragleave',function(){
      btn.style.borderTop='';
    });
    btn.addEventListener('drop',function(e){
      e.preventDefault();
      btn.style.borderTop='';
      var fromId=e.dataTransfer.getData('text/plain');
      if(fromId===p.id)return;
      var fromIdx=projs.findIndex(function(x){return x.id===fromId;});
      var toIdx=projs.findIndex(function(x){return x.id===p.id;});
      if(fromIdx<0||toIdx<0)return;
      var moved=projs.splice(fromIdx,1)[0];
      projs.splice(toIdx,0,moved);
      save();buildSB();renderDash();
    });

    el.appendChild(btn);
  });

  var nbEl=document.getElementById('nbP');if(nbEl)nbEl.textContent=projs.length;
  var nn=notifs.length,nb=document.getElementById('nbN');
  if(nb){if(nn>0){nb.style.display='';nb.textContent=nn;nb.className='nb nb-rd';}else nb.style.display='none';}
}

function renderDashTasks(){
  var el=document.getElementById('dash-tasks');if(!el)return;
  var today=new Date();today.setHours(0,0,0,0);
  var recLabels={yearly:'Anual',weekly:'Semanal',monthly:'Mensual',quarterly:'Trimestral'};
  var PRIO={alta:'[A]',media:'[M]',baja:'[B]'};
  var PRIO_STYLE={alta:'background:#FDECEA;color:#C02020',media:'background:#FEF9E7;color:#8A5200',baja:'background:#E8F5E9;color:#2E7D32'};

  var filterHtml='<div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:1.1rem">'
    +'<span style="font-size:10px;font-weight:700;color:#9896B8;text-transform:uppercase;letter-spacing:.05em">Consultor:</span>'
    +'<button class="dff'+(dashFilt===''?' on':'')+'" onclick="setDashFilt(\'\',this)" style="padding:4px 11px;border-radius:20px;border:1px solid rgba(42,41,99,.15);font-size:11px;cursor:pointer;font-weight:'+(dashFilt===''?'700':'500')+';background:'+(dashFilt===''?'#2A2963':'#fff')+';color:'+(dashFilt===''?'#fff':'#5A5880')+'">Todos</button>'
    +TEAM.map(function(n){var on=dashFilt===n;return'<button class="dff'+(on?' on':'')+'" onclick="setDashFilt(\''+n+'\',this)" style="padding:4px 11px;border-radius:20px;border:1px solid rgba(42,41,99,.15);font-size:11px;cursor:pointer;font-weight:'+(on?'700':'500')+';background:'+(on?'#2A2963':'#fff')+';color:'+(on?'#fff':'#5A5880')+'"><span style="display:inline-flex;width:17px;height:17px;border-radius:50%;background:'+(on?'rgba(255,255,255,.25)':'#ECEAF8')+';color:'+(on?'#fff':'#2A2963')+';font-size:9px;font-weight:700;align-items:center;justify-content:center;margin-right:4px;vertical-align:middle">'+ini(n)+'</span>'+esc(n)+'</button>';}).join('')
    +'<button onclick="printTasks()" style="margin-left:auto;padding:5px 12px;border-radius:20px;border:1px solid rgba(42,41,99,.2);background:#2A2963;color:#fff;font-size:11px;cursor:pointer;display:flex;align-items:center;gap:5px"><i class="ti ti-file-type-pdf" style="font-size:12px"></i>Exportar PDF</button>'
    +'</div>';

  var names=dashFilt?[dashFilt]:TEAM;
  var h='';

  names.forEach(function(name){
    var mySubs=[];
    projs.forEach(function(p){
      var pda=pdata(p.id);
      pda.tools.forEach(function(t){
        var tIdx=pda.tools.findIndex(function(x){return x.id===t.id;});
        var calcd=calcToolDates(t,p.start,tIdx);
        t.subtasks.forEach(function(s){
          if(s.person===name&&s.status!=='Completada'){
            mySubs.push({projName:p.name,projId:p.id,toolNum:t.num,toolName:t.name,
              toolSt:tStat(t),toolStart:calcd.start,toolEnd:calcd.end,sub:s});
          }
        });
      });
    });
    if(!mySubs.length)return;

    var pend=mySubs.length;
    var late=mySubs.filter(function(x){return x.sub.date&&new Date(x.sub.date+'T23:59:59')<today;}).length;

    h+='<div style="background:#fff;border:1px solid rgba(42,41,99,.08);border-radius:14px;margin-bottom:1rem;overflow:hidden">';
    h+='<div style="background:#1E1D4A;padding:.875rem 1rem;display:flex;align-items:center;gap:10px">'
      +'<div style="width:34px;height:34px;border-radius:50%;background:#D94F2B;color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center">'+ini(name)+'</div>'
      +'<div><div style="font-size:14px;font-weight:700;color:#fff">'+esc(name)+'</div>'
      +'<div style="font-size:10px;color:rgba(255,255,255,.5)">'+pend+' pendiente'+(pend!==1?'s':'')+(late?' &middot; <b style="color:#F5A8A4">'+late+' vencida'+(late!==1?'s':'')+'</b>':'')+'</div>'
      +'</div></div>';

    var groups=[],gMap={};
    mySubs.forEach(function(x){
      var k=x.projId+'||'+x.toolNum;
      if(!gMap[k]){gMap[k]={projName:x.projName,projId:x.projId,toolNum:x.toolNum,
        toolName:x.toolName,toolSt:x.toolSt,toolStart:x.toolStart,toolEnd:x.toolEnd,items:[]};
        groups.push(gMap[k]);}
      gMap[k].items.push(x);

// Cambiar fecha de subtarea desde vista de tareas
function iSDDash(projId,toolNum,sid,val){
  var pda=pd[projId];if(!pda)return;
  var t=pda.tools.find(function(t){return t.num===toolNum;});if(!t)return;
  var s=t.subtasks.find(function(s){return s.id===sid;});if(!s)return;
  s.date=val;save();renderDashTasks();
}

// Cambiar estado de subtarea desde vista de tareas
function iSSDash(projId,toolNum,sid,val){
  var pda=pd[projId];if(!pda)return;
  var t=pda.tools.find(function(t){return t.num===toolNum;});if(!t)return;
  var s=t.subtasks.find(function(s){return s.id===sid;});if(!s)return;
  s.status=val;s.done=(val==='Completada');save();renderDashTasks();renderDash();
}

// Cambiar estado de herramienta desde vista de tareas
function iTS(projId,toolNum,val){
  var pda=pd[projId];if(!pda)return;
  var t=pda.tools.find(function(t){return t.num===toolNum;});if(!t)return;
  t.status=val;save();renderDashTasks();renderDash();
}

// Marcar subtarea como hecha desde la vista de tareas
function togStDash(projId,toolNum,sid){
  var pda=pd[projId];if(!pda)return;
  var t=pda.tools.find(function(t){return t.num===toolNum;});if(!t)return;
  var s=t.subtasks.find(function(s){return s.id===sid;});if(!s)return;
  var wasDone=s.done;
  s.done=!s.done;s.status=s.done?'Completada':'Pendiente';
  if(s.done&&!wasDone&&s.recurrent){
    var nextDate=nextRecDate(s.date,s.recurrent);
    var newSub={
      id:projId+'_rec_'+Date.now(),
      text:s.text,person:s.person||'',
      date:nextDate,status:'Pendiente',
      notes:s.notes||'',done:false,
      recurrent:s.recurrent,link:s.link||'',priority:s.priority||''
    };
    var idx2=t.subtasks.findIndex(function(x){return x.id===sid;});
    t.subtasks.splice(idx2+1,0,newSub);
    showToast('Nueva tarea creada: '+fmt(nextDate));
  }
  save();renderDashTasks();renderDash();
}

function renderTeam(){
  var today=new Date();

  var allS=allT.flatMap(function(t){return t.subtasks;});
  document.getElementById('teamG').innerHTML=TEAM.map(function(name){
    var mt=allT.filter(function(t){return t.person===name;});
    var ms=allS.filter(function(s){return s.person===name;});
    var sp=ms.filter(function(s){return !s.done;}).length;var sd=ms.filter(function(s){return s.done;}).length;
    var lt=ms.filter(function(s){return !s.done&&s.date&&new Date(s.date+'T23:59:59')<today;}).length;
    return'<div class="mc"><div class="mch"><div class="mca">'+ini(name)+'</div><div><div class="mcn">'+esc(name)+'</div><div class="mcs2">'+mt.length+' herramienta'+(mt.length!==1?'s':'')+'</div></div></div>'

// ─ IMPRIMIR PDF ─
function buildExportRows(){
  var p=proj();if(!p)return null;
  var tools=pdata().tools;
  var prioMap={alta:'Alta',media:'Media',baja:'Baja'};
  var recMap={yearly:'Anual',weekly:'Semanal',monthly:'Mensual',quarterly:'Trimestral'};
  var rows=[];
  tools.forEach(function(t){
    var st=tStat(t),pct=tPct(t);
    rows.push({tipo:'herramienta',num:t.num,nombre:t.name,responsable:t.person||'',fecha:t.date?fmt(t.date):'',estado:st,prioridad:'',avance:pct+'%'});
    t.subtasks.forEach(function(s){
      var rec=s.recurrent?' ['+(recMap[s.recurrent]||s.recurrent)+']':'';
      rows.push({tipo:'subtarea',num:'',nombre:(s.done?'\u2611':'\u2610')+' '+s.text+rec,responsable:s.person||'',fecha:s.date?fmt(s.date):'',estado:s.status,prioridad:prioMap[s.priority||'']||'',avance:s.done?'100%':''});
    });
  });
  return {p:p,tools:tools,rows:rows};
}

function exportExcel(){
  var data=buildExportRows();if(!data)return;
  if(typeof XLSX==='undefined'){alert('No se pudo cargar la libreria de Excel (revisa tu conexion a internet).');return;}
  var aoa=[['Herramienta / Tarea','Responsable','Fecha','Estado','Prioridad','Avance']];
  data.rows.forEach(function(r){
    aoa.push([(r.tipo==='subtarea'?'   ':'')+r.nombre, r.responsable||'—', r.fecha||'—', r.estado, r.prioridad||'—', r.avance]);
  });
  var ws=XLSX.utils.aoa_to_sheet(aoa);
  ws['!cols']=[{wch:42},{wch:16},{wch:12},{wch:14},{wch:12},{wch:8}];
  var wb=XLSX.utils.book_new();
  var sheetName=(data.p.name||'Proyecto').replace(/[\\\/\?\*\[\]:]/g,' ').slice(0,31)||'Proyecto';
  XLSX.utils.book_append_sheet(wb,ws,sheetName);
  var d=new Date();
  var ds=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  var fname=(data.p.name||'proyecto').replace(/[^a-z0-9]+/gi,'_')+'_'+ds+'.xlsx';
  XLSX.writeFile(wb,fname);
  showToast('Excel exportado correctamente.');
}

function addSt(tid){var inp=document.getElementById('nst_'+tid);var text=inp.value.trim();if(!text)return;var t=findTool(tid);if(!t)return;t.subtasks.push({id:tid+'_st'+Date.now(),text:text,person:'',date:'',status:'Pendiente',notes:'',done:false,recurrent:''});inp.value='';save();renderToolsKeepOpen();}

function addTool(){
  var pda=pdata();
  // El nuevo número es el índice = length actual (0-based: H00=0, H01=1...)
  var nxt=String(pda.tools.length).padStart(2,'0');
  pda.tools.push({id:curP+'_'+nxt+'_'+Date.now(),num:nxt,name:'Nueva herramienta',
    person:'',date:'',ganttStart:'',status:'Pendiente',notes:'',recurrent:'',subtasks:[]});
  save();renderTools();renderPH();
}

function closeMoSt(){document.getElementById('moSt').classList.remove('on');eStids=null;}

function closeMoTool(){document.getElementById('moTool').classList.remove('on');eTid=null;}

function closePM(){document.getElementById('moPr').classList.remove('on');}

function collapseAll(){document.querySelectorAll('.stl').forEach(function(e){e.classList.remove('open');});document.querySelectorAll('.cv').forEach(function(e){e.classList.remove('open');});}

function delProj(pid){if(!confirm('Eliminar este proyecto?'))return;projs=projs.filter(function(p){return p.id!==pid;});delete pd[pid];save();buildSB();showG('dash',document.querySelector('.nav-i'));}

function delSt(tid,sid){var t=findTool(tid);if(!t)return;t.subtasks=t.subtasks.filter(function(s){return s.id!==sid;});save();renderToolsKeepOpen();}

function delTool(tid){if(!confirm('Eliminar esta herramienta?'))return;var pda=pdata();pda.tools=pda.tools.filter(function(t){return t.id!==tid;});pda.tools.forEach(function(t,i){
      // Si la primera herramienta es Plan Director, empezar desde 00
      var hasPD=pda.tools[0]&&pda.tools[0].name==='Plan Director';
      t.num=String(hasPD?i:i+1).padStart(2,'0');
    });save();renderTools();renderPH();}

function editProj(pid){
  var p=proj(pid);if(!p)return;
  document.getElementById('pName').value=p.name;document.getElementById('pStart').value=p.start||'';document.getElementById('pEnd').value=p.end||'';
  document.getElementById('moPT').textContent='Editar proyecto';
  document.getElementById('pTeamCbs').innerHTML=TEAM.map(function(n){return'<label style="display:flex;align-items:center;gap:6px;font-size:12px;cursor:pointer;padding:2px 0"><input type="checkbox" value="'+n+'" '+((p.team||[]).indexOf(n)>=0?'checked':'')+' style="width:auto;accent-color:var(--nv)"><span>'+esc(n)+'</span></label>';}).join('');
  document.getElementById('moPr').classList.add('on');
  document.getElementById('pSaveBtn').onclick=function(){
    var nm=document.getElementById('pName').value.trim();if(!nm)return;
    var tm=[].slice.call(document.querySelectorAll('#pTeamCbs input:checked')).map(function(i){return i.value;});
    p.name=nm;p.start=document.getElementById('pStart').value;p.end=document.getElementById('pEnd').value;p.team=tm;
    save();buildSB();closePM();renderPH();renderDash();
    document.getElementById('pSaveBtn').onclick=saveNewP;
  };
}

function expandAll(){document.querySelectorAll('.stl').forEach(function(e){e.classList.add('open');});document.querySelectorAll('.cv').forEach(function(e){e.classList.add('open');});}

function openMoSt(tid,sid){var t=findTool(tid);if(!t)return;var s=t.subtasks.find(function(x){return x.id===sid;});if(!s)return;eStids={tid:tid,sid:sid};document.getElementById('moST').textContent=t.num+'. '+t.name;document.getElementById('stDesc').value=s.text;document.getElementById('stPers').innerHTML=teamOptsM(s.person);document.getElementById('stDate').value=s.date||s.due_date||'';document.getElementById('stStat').value=s.status||'Pendiente';if(document.getElementById('stRec'))document.getElementById('stRec').value=s.recurrent||'';document.getElementById('stNotes').value=s.notes||'';
  var stPrioEl=document.getElementById('stPrio');
  if(stPrioEl) stPrioEl.value=s.priority||s.prio||'';
  var stLinkEl=document.getElementById('stLink');
  if(stLinkEl){
    stLinkEl.value=s.link||'';
    var prev=document.getElementById('stLinkPreview');
    if(prev){prev.style.display=s.link?'flex':'none';prev.href=s.link||'#';}
    stLinkEl.oninput=function(){var v=this.value.trim();var p=document.getElementById('stLinkPreview');if(p){p.style.display=v?'flex':'none';p.href=v||'#';}};
  }document.getElementById('moSt').classList.add('on');}

function openMoTool(tid){
  var t=findTool(tid);if(!t)return;
  eTid=tid;
  // Calcular fechas automáticas si no hay manuales
  var p=proj();
  var tools=pdata().tools;
  var toolIdx=tools.findIndex(function(x){return x.id===t.id;});
  var calcd=calcToolDates(t,p?p.start:'',toolIdx<0?0:toolIdx);
  document.getElementById('moTT').textContent=t.num+'. '+t.name;
  document.getElementById('eName').value=t.name;
  document.getElementById('ePers').innerHTML=teamOptsM(t.person);
  // Mostrar fecha calculada si no hay manual
  document.getElementById('eStart').value=t.ganttStart||calcd.start||'';
  document.getElementById('eDate').value=t.date||calcd.end||'';
  document.getElementById('eStat').value=t.status||'Pendiente';
  document.getElementById('eNotes').value=t.notes||'';
  document.getElementById('moTool').classList.add('on');
}

function openPM(){
  ['pName','pStart','pEnd'].forEach(function(id){document.getElementById(id).value='';});
  document.getElementById('moPT').textContent='Nuevo proyecto';
  document.getElementById('pTeamCbs').innerHTML=TEAM.map(function(n){return'<label style="display:flex;align-items:center;gap:6px;font-size:12px;cursor:pointer;padding:2px 0"><input type="checkbox" value="'+n+'" '+(n===ME?'checked':'')+' style="width:auto;accent-color:var(--nv)"><span>'+esc(n)+'</span></label>';}).join('');
  document.getElementById('pSaveBtn').onclick=saveNewP;
  document.getElementById('moPr').classList.add('on');
  setTimeout(function(){document.getElementById('pName').focus();},50);
}

function renderGantt(){
  var p=proj();
  if(!p||!p.start){
    document.getElementById('ganttW').innerHTML='<div class="emp2"><i class="ti ti-calendar-off"></i>Define la fecha de inicio del proyecto para ver el Gantt</div>';
    return;
  }
  var tools=pdata().tools;
  if(!tools.length){
    document.getElementById('ganttW').innerHTML='<div class="emp2"><i class="ti ti-calendar-stats"></i>Sin herramientas</div>';
    return;
  }

  function parseD(str){var pt=str.split('-');return new Date(parseInt(pt[0]),parseInt(pt[1])-1,parseInt(pt[2]));}
  function toISO(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}

  var W=7*864e5;
  var projStart=parseD(p.start);  // = inicio real (H01)
  // El Gantt empieza 5 semanas antes (= inicio del Plan Director H00)
  var ganttOrigin=new Date(projStart.getTime()-5*W);
  var today=new Date(); today.setHours(0,0,0,0);

  // Calcular fechas de cada herramienta
  tools.forEach(function(t,i){
    var calcd=calcToolDates(t,p.start,i);
    t._s=calcd.start?parseD(calcd.start):null;
    t._e=calcd.end?parseD(calcd.end):null;
    t._dw=calcd.dw;
  });

  // Total semanas desde ganttOrigin hasta el último fin
  var lastEnd=tools.reduce(function(max,t){return t._e&&t._e>max?t._e:max;},ganttOrigin);
  var totalWeeks=Math.max(Math.ceil((lastEnd-ganttOrigin)/W)+2, 14);
  // Semana de "hoy" relativa a ganttOrigin
  var todayWeek=Math.floor((today-ganttOrigin)/W);

  var LW=180;  // ancho columna nombre
  var SW=36;   // ancho por semana
  var totalW=LW+(totalWeeks*SW);

  var MESES=['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];

  // Agrupar semanas por mes
  var monthGroups=[];
  var curKey=-1,curStart2=0,curCount=0;
  for(var w=0;w<totalWeeks;w++){
    var ws=new Date(ganttOrigin.getTime()+w*W);
    var key=ws.getFullYear()*100+ws.getMonth();
    if(key!==curKey){
      if(curKey>=0)monthGroups.push({key:curKey,start:curStart2,count:curCount});
      curKey=key;curStart2=w;curCount=1;
    } else {curCount++;}
  }
  if(curCount>0)monthGroups.push({key:curKey,start:curStart2,count:curCount});

  var h='<div style="overflow-x:auto;border-radius:14px;border:1px solid rgba(42,41,99,.08);background:#fff">';
  h+='<div style="min-width:'+totalW+'px">';

  // ── Fila 1: Meses ──
  h+='<div style="display:flex;background:#1E1D4A;border-bottom:1px solid rgba(255,255,255,.08)">';
  h+='<div style="width:'+LW+'px;flex-shrink:0;padding:6px 10px;font-size:10px;font-weight:700;color:rgba(255,255,255,.4)">Herramienta</div>';
  monthGroups.forEach(function(mg){
    var mesIdx=mg.key%100;
    var yr=String(Math.floor(mg.key/100)).slice(2);
    h+='<div style="width:'+(mg.count*SW)+'px;flex-shrink:0;text-align:center;padding:6px 4px;font-size:11px;font-weight:700;color:#fff;border-left:1px solid rgba(255,255,255,.1)">'
      +MESES[mesIdx]+" '"+yr+'</div>';
  });
  h+='</div>';

  // ── Fila 2: Semanas (S1, S2... desde inicio PD) ──
  h+='<div style="display:flex;background:#2A2963;border-bottom:2px solid rgba(255,255,255,.12)">';
  h+='<div style="width:'+LW+'px;flex-shrink:0"></div>';
  for(var w=0;w<totalWeeks;w++){
    var isNow=(w===todayWeek);
    // Marcar S6 como inicio del proyecto real
    var isProjectStart=(w===5);
    h+='<div style="width:'+SW+'px;flex-shrink:0;text-align:center;padding:3px 1px;font-size:9px;font-weight:'+(isNow||isProjectStart?'700':'400')+';color:'+(isNow?'#F88':'rgba(255,255,255,.35)')+';border-left:1px solid rgba(255,255,255,.05);background:'+(isNow?'rgba(232,58,58,.4)':isProjectStart?'rgba(255,255,255,.08)':'transparent')+'">S'+(w+1)+'</div>';
  }
  h+='</div>';

  // ── Filas: Herramientas ──
  tools.forEach(function(t){
    var st=tStat(t);
    var sw2=t._s?Math.max(0,Math.round((t._s-ganttOrigin)/W)):0;
    var ew2=t._e?Math.max(sw2+1,Math.round((t._e-ganttOrigin)/W)):sw2+1;

    var isLate=(t._e&&t._e<today&&st!=='Completada');
    var inProg=(t._s&&t._s<=today&&t._e&&t._e>=today);
    var barBg=st==='Completada'?'linear-gradient(90deg,#2E9E5A,#4DC97A)':
              isLate?'linear-gradient(90deg,#D94F2B,#F5724A)':
              inProg?'linear-gradient(90deg,#3A7BD5,#5A9BF5)':
              'rgba(42,41,99,.1)';
    var isDashed=(!isLate&&!inProg&&st!=='Completada');
    var txtColor=isDashed?'rgba(42,41,99,.4)':'rgba(255,255,255,.95)';
    // H00 Plan Director: color especial (gris oscuro)
    if(t.num==='00'){barBg='linear-gradient(90deg,#4A4A6A,#6A6A9A)';isDashed=false;txtColor='rgba(255,255,255,.9)';}

    h+='<div style="display:flex;align-items:center;border-bottom:1px solid rgba(42,41,99,.05);min-height:30px">';
    h+='<div style="width:'+LW+'px;flex-shrink:0;padding:3px 8px;display:flex;align-items:center;gap:5px;overflow:hidden">'
      +'<span style="font-size:10px;font-weight:800;color:#fff;background:'+(t.num==='00'?'#4A4A6A':'#2A2963')+';border-radius:5px;padding:2px 6px;font-family:DM Mono,monospace;flex-shrink:0">'+t.num+'</span>'
      +'<span style="font-size:11px;font-weight:600;color:#1A1940;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1" title="'+esc(t.name)+'">'+esc(t.name)+'</span>'
      +(t.person?'<span style="font-size:8px;font-weight:700;padding:1px 5px;border-radius:20px;background:#2A2963;color:#fff;flex-shrink:0;white-space:nowrap;max-width:55px;overflow:hidden;text-overflow:ellipsis">'+esc(t.person)+'</span>':'')
      +'</div>';

    h+='<div style="flex:1;position:relative;height:30px;overflow:hidden">';

    // Línea vertical en S6 = inicio real del proyecto
    h+='<div style="position:absolute;top:0;bottom:0;left:'+(5*SW+SW/2)+'px;width:1px;background:rgba(42,41,99,.2);z-index:3;pointer-events:none"></div>';

    // Línea de hoy
    if(todayWeek>=0&&todayWeek<totalWeeks){
      h+='<div style="position:absolute;top:0;bottom:0;left:'+(todayWeek*SW+SW/2)+'px;width:2px;background:#E83A3A;z-index:4;pointer-events:none"></div>';
    }

    // Separadores de semana
    for(var w2=1;w2<totalWeeks;w2++){
      h+='<div style="position:absolute;top:0;bottom:0;left:'+(w2*SW)+'px;width:1px;background:rgba(42,41,99,.04);z-index:1"></div>';
    }

    // Barra
    var bl=sw2*SW;
    var bw=Math.max(SW,(ew2-sw2)*SW);
    h+='<div style="position:absolute;top:5px;left:'+bl+'px;width:'+bw+'px;height:20px;border-radius:4px;background:'+barBg+';'+(isDashed?'border:1.5px dashed rgba(42,41,99,.25);':'')+';display:flex;align-items:center;overflow:hidden;z-index:2;box-shadow:0 1px 3px rgba(0,0,0,.08)" title="'+esc(t.name)+': S'+(sw2+1)+' → S'+(ew2+1)+'">'
      +(bw>45?'<span style="font-size:9px;font-weight:700;color:'+txtColor+';padding:0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+esc(t.name)+'</span>':'')
      +'</div>';

    h+='</div></div>';
  });

  h+='</div></div>';

  // Leyenda
  h+='<div style="display:flex;gap:14px;margin-top:.75rem;flex-wrap:wrap;font-size:10px;color:#5A5880">'
    +'<span style="display:flex;align-items:center;gap:5px"><span style="width:14px;height:10px;border-radius:3px;background:linear-gradient(90deg,#4A4A6A,#6A6A9A);display:inline-block"></span>Plan Director</span>'
    +'<span style="display:flex;align-items:center;gap:5px"><span style="width:14px;height:10px;border-radius:3px;background:linear-gradient(90deg,#3A7BD5,#5A9BF5);display:inline-block"></span>En curso</span>'
    +'<span style="display:flex;align-items:center;gap:5px"><span style="width:14px;height:10px;border-radius:3px;background:linear-gradient(90deg,#2E9E5A,#4DC97A);display:inline-block"></span>Completada</span>'
    +'<span style="display:flex;align-items:center;gap:5px"><span style="width:14px;height:10px;border-radius:3px;background:linear-gradient(90deg,#D94F2B,#F5724A);display:inline-block"></span>Retrasada</span>'
    +'<span style="display:flex;align-items:center;gap:5px"><span style="width:14px;height:10px;border-radius:3px;background:rgba(42,41,99,.1);border:1.5px dashed rgba(42,41,99,.3);display:inline-block"></span>Pendiente</span>'
    +'<span style="display:flex;align-items:center;gap:5px"><span style="width:2px;height:14px;background:#E83A3A;display:inline-block"></span>Hoy</span>'
    +'<span style="display:flex;align-items:center;gap:5px"><span style="width:1px;height:14px;background:rgba(42,41,99,.3);display:inline-block"></span>Inicio proyecto</span>'
    +'</div>';

  document.getElementById('ganttW').innerHTML=h;
}

function renderTools(){
  var p=proj();
  if(!p){document.getElementById('toolList').innerHTML='<div class="emp2"><i class="ti ti-tools"></i>Sin proyecto</div>';return;}
  var pf=document.getElementById('pfilt')?document.getElementById('pfilt').value:'';
  var today=new Date();
  var tools=pdata().tools.slice();
  if(pf)tools=tools.filter(function(t){return t.person===pf||t.subtasks.some(function(s){return s.person===pf;});});
  if(filt==='pendiente')tools=tools.filter(function(t){return tStat(t)==='Pendiente';});
  else if(filt==='curso')tools=tools.filter(function(t){return tStat(t)==='En curso';});
  else if(filt==='done')tools=tools.filter(function(t){return tStat(t)==='Completada';});
  else if(filt==='mias'){var mn=ME;tools=tools.filter(function(t){return t.person===mn||t.subtasks.some(function(s){return s.person===mn;});});}
  if(!tools.length){document.getElementById('toolList').innerHTML='<div class="emp2"><i class="ti ti-filter-off"></i>Sin resultados</div>';return;}
  var con=document.getElementById('toolList');con.innerHTML='';
  tools.forEach(function(tool){
    var st=tStat(tool),pct=tPct(tool),tid=tool.id;
    var late=!!(tool.date&&st!=='Completada'&&new Date(tool.date+'T23:59:59')<today);
    var blk=document.createElement('div');blk.className='tb';blk.id='tb_'+tid;
    blk.draggable=true;
    blk.setAttribute('data-tid',tid);
    blk.addEventListener('dragstart',function(e){
      e.dataTransfer.setData('text/plain',tid);
      blk.style.opacity='0.5';
    });
    blk.addEventListener('dragend',function(){blk.style.opacity='1';});
    blk.addEventListener('dragover',function(e){e.preventDefault();blk.style.borderTop='2px solid #2A2963';});
    blk.addEventListener('dragleave',function(){blk.style.borderTop='';});
    blk.addEventListener('drop',function(e){
      e.preventDefault();blk.style.borderTop='';
      var fromId=e.dataTransfer.getData('text/plain');
      if(fromId===tid)return;
      var pda=pdata();
      var tools=pda.tools;
      var fromIdx=tools.findIndex(function(t){return t.id===fromId;});
      var toIdx=tools.findIndex(function(t){return t.id===tid;});
      if(fromIdx<0||toIdx<0)return;
      var moved=tools.splice(fromIdx,1)[0];
      tools.splice(toIdx,0,moved);
      tools.forEach(function(t,i){t.num=String(i+1).padStart(2,'0');});
      save();renderTools();renderPH();
    });
    var hdr=document.createElement('div');hdr.className='th';
    hdr.addEventListener('click',function(e){togT(e,tid);});
    var numEl=document.createElement('span');numEl.className='tn';numEl.textContent=tool.num;hdr.appendChild(numEl);
    var nameEl=document.createElement('input');nameEl.className='tne';nameEl.value=tool.name;
    nameEl.addEventListener('click',function(e){e.stopPropagation();});
    nameEl.addEventListener('change',function(){updTN(tid,this.value);});hdr.appendChild(nameEl);
    // Columnas 3-5 (prioridad/recurrencia/enlace) no aplican a nivel herramienta: se reservan vacias
    // para que persona/estado/fecha caigan en la misma columna que en las subtareas.
    var metaPh=document.createElement('span');metaPh.style.cssText='visibility:hidden';hdr.appendChild(metaPh);
    hdr.insertAdjacentHTML('beforeend',pSel(tool.person,'iTP(\''+tid+'\',this.value)'));
    hdr.insertAdjacentHTML('beforeend',sSel(st,'iTS(\''+tid+'\',this.value)'));
    // Calcular fecha fin desde schedule (la fecha de inicio sigue editable desde "Editar")
    var p2=proj();
    var allToolsList=pdata().tools;
    var tIdx=allToolsList.findIndex(function(x){return x.id===tool.id;});
    var calcd=calcToolDates(tool, p2?p2.start:'', tIdx>=0?tIdx:0);
    var endLate=!!(calcd.end&&st!=='Completada'&&new Date(calcd.end+'T23:59:59')<today);
    hdr.insertAdjacentHTML('beforeend', dInp(calcd.end, endLate, 'iTD(\''+tid+'\',this.value)'));
    var eb=document.createElement('button');eb.className='ib';eb.innerHTML='<i class="ti ti-edit"></i>';eb.title='Editar';eb.addEventListener('click',function(e){e.stopPropagation();openMoTool(tid);});hdr.appendChild(eb);
    var db2=document.createElement('button');db2.className='ib';db2.innerHTML='<i class="ti ti-trash"></i>';db2.title='Eliminar';db2.addEventListener('click',function(e){e.stopPropagation();delTool(tid);});hdr.appendChild(db2);
    hdr.insertAdjacentHTML('beforeend','<div class="mp" title="Avance: '+pct+'%"><div class="mf'+(pct===100?' full':'')+'" style="width:'+pct+'%"></div></div>');
    hdr.insertAdjacentHTML('beforeend','<i class="ti ti-chevron-down cv" id="cv_'+tid+'"></i>');
    blk.appendChild(hdr);
    var stList=document.createElement('div');stList.className='stl';stList.id='stl_'+tid;
    tool.subtasks.forEach(function(s){
      var sid=s.id;var stLate=!!(s.date&&!s.done&&new Date(s.date+'T23:59:59')<today);
      var row=document.createElement('div');row.className='str';row.id='st_'+s.id;
      row.draggable=true;
      row.setAttribute('data-sid',s.id);
      row.addEventListener('dragstart',function(e){
        e.dataTransfer.setData('text/plain',s.id);
        e.dataTransfer.effectAllowed='move';
        row.style.opacity='0.4';
        e.stopPropagation();
      });
      row.addEventListener('dragend',function(){
        row.style.opacity='1';
        document.querySelectorAll('.str').forEach(function(r){r.style.borderTop='';});
      });
      row.addEventListener('dragover',function(e){
        e.preventDefault();e.stopPropagation();
        e.dataTransfer.dropEffect='move';
        row.style.borderTop='2px solid #2A2963';
      });
      row.addEventListener('dragleave',function(){row.style.borderTop='';});
      row.addEventListener('drop',function(e){
        e.preventDefault();e.stopPropagation();
        row.style.borderTop='';
        var fromId=e.dataTransfer.getData('text/plain');
        if(fromId===s.id)return;
        var t2=findTool(tid);if(!t2)return;
        var fromIdx=t2.subtasks.findIndex(function(x){return x.id===fromId;});
        var toIdx=t2.subtasks.findIndex(function(x){return x.id===s.id;});
        if(fromIdx<0||toIdx<0)return;
        var moved=t2.subtasks.splice(fromIdx,1)[0];
        t2.subtasks.splice(toIdx,0,moved);
        save();renderToolsKeepOpen();
      });
      var ck=document.createElement('div');ck.className='ck'+(s.done?' on':'');if(s.done)ck.innerHTML='<i class="ti ti-check"></i>';
      ck.addEventListener('click',function(){togSt(tid,sid);});row.appendChild(ck);
      var stEd=document.createElement('input');stEd.className='se'+(s.done?' done':'');stEd.value=s.text;
      if(s.done)stEd.style.cssText='text-decoration:line-through;color:var(--tx3)';
      stEd.addEventListener('click',function(e){e.stopPropagation();});
      stEd.addEventListener('change',function(){updStT(tid,sid,this.value);});row.appendChild(stEd);
      // Prioridad + recurrencia + enlace: ahora comparten UNA sola celda de ancho fijo
      // (para no desalinear las columnas siguientes) cuyo contenido se pega al borde
      // derecho, junto a la persona asignada, en vez de dejar un hueco ancho.
      var metaCell=document.createElement('div');
      metaCell.style.cssText='display:flex;align-items:center;justify-content:flex-end;gap:3px;overflow:hidden';
      var prioSel=document.createElement('select');
      prioSel.style.cssText='border:none;background:transparent;font-size:12px;cursor:pointer;padding:0;outline:none;flex-shrink:0;width:20px;text-align:center;text-align-last:center;appearance:none;-webkit-appearance:none;-moz-appearance:none';
      prioSel.title='Prioridad';
      [{v:'',t:'—'},{v:'alta',t:'🔴'},{v:'media',t:'🟡'},{v:'baja',t:'🟢'}].forEach(function(o){
        var opt=document.createElement('option');opt.value=o.v;opt.textContent=o.t;
        var cur_prio=s.priority||'';if(cur_prio===o.v)opt.selected=true;
        prioSel.appendChild(opt);
      });
      prioSel.addEventListener('change',function(e){e.stopPropagation();iSPrio(tid,sid,this.value);});
      prioSel.addEventListener('click',function(e){e.stopPropagation();});
      metaCell.appendChild(prioSel);
      if(s.recurrent){
        var recMap={yearly:'ANUAL',weekly:'SEM',monthly:'MES',quarterly:'TRIM'};
        var rb=document.createElement('span');
        rb.style.cssText='font-size:8px;font-weight:700;padding:1px 6px;border-radius:20px;background:#8B3FA8;color:#fff;flex-shrink:0;box-sizing:border-box;text-align:center;white-space:nowrap';
        rb.textContent=recMap[s.recurrent]||s.recurrent;
        metaCell.appendChild(rb);
      }
      if(s.link){
        var lnkBtn=document.createElement('a');
        lnkBtn.href=s.link;
        lnkBtn.target='_blank';
        lnkBtn.className='ib';
        lnkBtn.title=s.link;
        lnkBtn.innerHTML='<i class="ti ti-paperclip"></i>';
        lnkBtn.style.cssText='color:#2A2963;flex-shrink:0;padding:1px';
        lnkBtn.addEventListener('click',function(e){e.stopPropagation();});
        metaCell.appendChild(lnkBtn);
      }
      row.appendChild(metaCell);
      row.insertAdjacentHTML('beforeend',pSel(s.person,'iSP(\''+tid+'\',\''+sid+'\',this.value)'));
      row.insertAdjacentHTML('beforeend',sSel(s.status,'iSS(\''+tid+'\',\''+sid+'\',this.value)'));
      row.insertAdjacentHTML('beforeend',dInp(s.date||s.due_date,stLate,'iSD(\''+tid+'\',\''+sid+'\',this.value)'));
      var sedit=document.createElement('button');sedit.className='ib';sedit.innerHTML='<i class="ti ti-edit"></i>';sedit.addEventListener('click',function(e){e.stopPropagation();openMoSt(tid,sid);});row.appendChild(sedit);
      var sdel=document.createElement('button');sdel.className='ib';sdel.innerHTML='<i class="ti ti-trash"></i>';sdel.addEventListener('click',function(e){e.stopPropagation();delSt(tid,sid);});row.appendChild(sdel);
      stList.appendChild(row);
    });
    var addR=document.createElement('div');addR.className='ar';
    addR.innerHTML='<input type="text" id="nst_'+tid+'" placeholder="Anadir tarea..."><button class="btn-sm"><i class="ti ti-plus" style="font-size:11px"></i>Anadir</button>';
    addR.querySelector('input').addEventListener('keydown',function(e){if(e.key==='Enter')addSt(tid);});
    addR.querySelector('button').addEventListener('click',function(){addSt(tid);});
    stList.appendChild(addR);blk.appendChild(stList);con.appendChild(blk);
  });
}

function teamOptsM(cur){return'<option value="">Sin asignar</option>'+((proj()&&proj().team)||[]).map(function(n){return'<option value="'+esc(n)+'"'+(cur===n?' selected':'')+'>'+esc(n)+'</option>';}).join('');}

function togSt(tid,sid){
  var t=findTool(tid);if(!t)return;
  var s=t.subtasks.find(function(x){return x.id===sid;});if(!s)return;
  var wasDone=s.done;
  s.done=!s.done;s.status=s.done?'Completada':'Pendiente';

  // Si se completa una tarea recurrente, crear la siguiente
  if(s.done&&!wasDone&&s.recurrent){
    var nextDate=nextRecDate(s.date,s.recurrent);
    var newSub={
      id:tid+'_rec_'+Date.now(),
      text:s.text,person:s.person||'',
      date:nextDate,status:'Pendiente',
      notes:s.notes||'',done:false,
      recurrent:s.recurrent,link:s.link||'',priority:s.priority||''
    };
    // Insertar justo después de la subtarea completada
    var idx2=t.subtasks.findIndex(function(x){return x.id===sid;});
    t.subtasks.splice(idx2+1,0,newSub);
    showToast('Nueva tarea creada: '+fmt(nextDate));
  }

  save();
  // Actualizar DOM sin cerrar la herramienta
  var row=document.getElementById('st_'+sid);
  if(row){
    var ck=row.querySelector('.ck');
    if(ck){ck.className='ck'+(s.done?' on':'');ck.innerHTML=s.done?'<i class="ti ti-check"></i>':'';}
    var se2=row.querySelector('.se');
    if(se2){se2.className='se'+(s.done?' done':'');se2.style.textDecoration=s.done?'line-through':'none';se2.style.color=s.done?'var(--tx3)':'';}
    var stSel=row.querySelector('select.sta');
    if(stSel){stSel.value=s.status;stSel.className='isl sta '+(s.done?'s-do':s.status==='En curso'?'s-cu':'s-pe');}

    if(s.done&&s.recurrent) renderToolsKeepOpen();
  } else {
    renderToolsKeepOpen();
  }
  renderPH();renderDash();
}

function calcToolDates(tool, projStart, toolIndex){
  // projStart = fecha de inicio real del proyecto = inicio de H01 (semana 6 del Excel)
  // sw = offset en semanas desde projStart (puede ser negativo para H00)
  var W=7*864e5;
  var sched=JUMP_SCHEDULE[tool.num];
  if(!sched){
    var schedKeys=Object.keys(JUMP_SCHEDULE);
    var idx2=toolIndex!==undefined&&toolIndex>=0?toolIndex:0;
    sched=JUMP_SCHEDULE[schedKeys[Math.min(idx2,schedKeys.length-1)]];
  }
  if(!sched||!projStart)return{start:'',end:'',dw:4};
  function parseD(str){var p=str.split('-');return new Date(parseInt(p[0]),parseInt(p[1])-1,parseInt(p[2]));}
  function toISO(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
  var ps=parseD(projStart);
  // sw ya es el offset directo desde projStart (positivo o negativo)
  var calcStart=(tool.ganttStart&&tool.ganttStart.length===10)
    ?parseD(tool.ganttStart)
    :new Date(ps.getTime()+sched.sw*W);
  var calcEnd=(tool.date&&tool.date.length===10)
    ?parseD(tool.date)
    :new Date(calcStart.getTime()+sched.dw*W);
  return{start:toISO(calcStart),end:toISO(calcEnd),dw:sched.dw};
}

// Resetear fechas manuales de todos los proyectos
function resetAllDates(){
  if(!confirm('Resetear fechas? Se calcularán automáticamente desde el inicio de cada proyecto.'))return;
  Object.keys(pd).forEach(function(pid){
    if(!pd[pid]||!pd[pid].tools)return;
    var tools=pd[pid].tools;
    // Eliminar TODOS los duplicados de Plan Director (H00 o cualquier "Plan Director")
    // Mantener solo uno
    var pdCount=0;
    pd[pid].tools=tools.filter(function(t){
      var isPD=(t.num==='00'||t.name==='Plan Director');
      if(isPD){pdCount++;return pdCount===1;}
      return true;
    });
    tools=pd[pid].tools;
    // Si no hay Plan Director, añadirlo al inicio
    if(!tools.some(function(t){return t.num==='00';})){
      var pdTool={
        id:pid+'_00_'+Date.now(),num:'00',name:'Plan Director',
        person:'',date:'',ganttStart:'',status:'Pendiente',notes:'',recurrent:'',
        subtasks:JUMP[0].sts.map(function(s2,i){
          return{id:pid+'_00_st'+i,text:s2,person:'',date:'',
                 status:'Pendiente',notes:'',done:false,recurrent:'',link:''};
        })
      };
      tools.unshift(pdTool);
    }
    // Renumerar: 00, 01, 02...
    tools.forEach(function(t,i){t.num=String(i).padStart(2,'0');});
    // Limpiar fechas manuales
    tools.forEach(function(t){t.ganttStart='';t.date='';});
  });
  save();
  if(curP){renderPH();renderTools();}
  var gEl=document.getElementById('pt-gantt');
  if(gEl&&gEl.style.display!=='none')renderGantt();
  renderDash();
  showToast('✓ Fechas reseteadas correctamente');
}

      var toolKey=x.projName+'|'+x.toolNum;
      if(toolKey!==lastTool){lastTool=toolKey;h+='<div class="tool-row">'+x.toolNum+' '+x.toolName+'</div>';}
      if(x.isToolOnly){h+='<div class="sub-row"><span class="cb"></span><span>'+x.toolName+'</span></div>';return;}
      var s=x.sub;
      var late2=!!(s.date&&!s.done&&new Date(s.date+'T23:59:59')<today);
      var rec=s.recurrent?(' <span style="font-size:9px;background:#8B3FA8;color:#fff;padding:1px 5px;border-radius:10px">'+(recLabels[s.recurrent]||s.recurrent)+'</span>'):'';
      h+='<div class="sub-row">'
        +'<span class="cb'+(s.done?' done':'')+'"></span>'
        +'<span style="flex:1;'+(s.done?'text-decoration:line-through;color:#9896B8':'')+'">'+s.text+rec+'</span>'
        +(s.date?'<span class="date'+(late2?' late':'')+'">'+( late2?'⚠ ':'')+new Date(s.date).toLocaleDateString('es-ES')+'</span>':'')
        +'</div>';
    });
  });
  h+='</body></html>';
  win.document.write(h);
  win.document.close();
  setTimeout(function(){win.print();},400);
}
function duplicateProj(pid){
  var src=projs.find(function(p){return p.id===pid;});if(!src)return;
  var newId='p'+Date.now();
  var newName=src.name+' (copia)';
  projs.push({id:newId,name:newName,start:'',end:'',team:src.team?src.team.slice():[]});
  var srcData=pdata(pid);
  pd[newId]={tools:srcData.tools.map(function(t){
    return{id:newId+'_'+t.num+'_'+Date.now(),num:t.num,name:t.name,person:t.person,
      date:'',ganttStart:'',status:'Pendiente',notes:t.notes||'',
      recurrent:t.recurrent||'',link:t.link||'',
      subtasks:t.subtasks.map(function(s){
        return{id:newId+'_st_'+Math.random().toString(36).slice(2),
          text:s.text,person:s.person||'',date:'',status:'Pendiente',
          notes:s.notes||'',done:false,recurrent:s.recurrent||'',
          link:s.link||'',priority:s.priority||''};
      })};
  })};
  save();buildSB();openProj(newId);
  showToast('Proyecto duplicado: '+newName);
}
function nextRecDate(dateStr, recurrent){
  if(!dateStr||!recurrent)return '';
  var parts=dateStr.split('-');
  var d=new Date(parseInt(parts[0]),parseInt(parts[1])-1,parseInt(parts[2]));
  if(recurrent==='weekly')  d.setDate(d.getDate()+7);
  else if(recurrent==='monthly') d.setMonth(d.getMonth()+1);
  else if(recurrent==='quarterly') d.setMonth(d.getMonth()+3);
  else if(recurrent==='yearly') d.setFullYear(d.getFullYear()+1);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function renderToolsKeepOpen(){
  // Guardar IDs de herramientas con stl open
  var open=[];
  document.querySelectorAll('.stl.open').forEach(function(el){
    open.push(el.id.replace('stl_',''));
  });
  renderTools();
  // Restaurar estado abierto
  open.forEach(function(tid){
    var stl=document.getElementById('stl_'+tid);
    var cv=document.getElementById('cv_'+tid);
    if(stl)stl.classList.add('open');
    if(cv)cv.classList.add('open');
  });
}
function autoSave() {
  try {
    var backup = { projects: projs, projectsData: pd, timestamp: new Date().getTime() };
    localStorage.setItem('tekams_autosave', JSON.stringify(backup));
  } catch (e) { console.error('Auto-save error:', e); }
}

function recoverAutosave() {
  try {
    var backup = JSON.parse(localStorage.getItem('tekams_autosave'));
    if (!backup) { alert('No hay auto-guardado'); return; }
    if (!confirm('Recuperar cambios desde: ' + new Date(backup.timestamp).toLocaleString() + '?')) return;
    projs = backup.projects || [];
    pd = backup.projectsData || {};
    buildSB(); renderDash(); renderPH();
    alert('Recuperado correctamente');
  } catch (e) { alert('Error: ' + e.message); }
}
