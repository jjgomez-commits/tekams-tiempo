<!DOCTYPE html>
<html>
<head>
    <title>Limpiador Completo - Todas las Claves</title>
    <style>
        body { font-family: Arial; padding: 20px; background: #f5f5f5; }
        .container { max-width: 700px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; }
        h1 { color: #333; }
        .status { padding: 10px; margin: 10px 0; border-radius: 4px; font-weight: bold; }
        .success { background: #d4edda; color: #155724; }
        button { padding: 12px 24px; background: #dc3545; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; font-weight: bold; }
        button:hover { background: #c82333; }
        pre { background: #f4f4f4; padding: 10px; overflow-x: auto; max-height: 400px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧹 Limpiador Completo</h1>
        <p>Busca y limpia "option" en TODAS las claves de localStorage</p>

        <div id="status"></div>

        <button onclick="limpiarTodo()">🚀 LIMPIAR TODAS LAS CLAVES</button>

        <hr>
        <h3>Proceso:</h3>
        <pre id="resultado">Esperando acción...</pre>
    </div>

    <script>
        function msg(texto, tipo = 'info') {
            const div = document.getElementById('status');
            div.className = 'status ' + tipo;
            div.textContent = texto;
        }

        function limpiarTodo() {
            let output = '🔍 Escaneando todas las claves...\n\n';
            let totalCorregidas = 0;

            try {
                // Recorrer TODAS las claves
                for (let i = 0; i < localStorage.length; i++) {
                    const clave = localStorage.key(i);
                    const datos = localStorage.getItem(clave);

                    output += `[${clave}] `;

                    if (datos && datos.includes('option')) {
                        try {
                            const obj = JSON.parse(datos);
                            const strAntes = JSON.stringify(obj);

                            // Limpiar recursivamente
                            const limpio = limpiarObjeto(obj);
                            const strDespues = JSON.stringify(limpio);

                            if (strAntes !== strDespues) {
                                localStorage.setItem(clave, strDespues);

                                const cambios = (strAntes.match(/recurrent":"option/g) || []).length;
                                totalCorregidas += cambios;

                                output += `✓ ${cambios} cambios\n`;
                            } else {
                                output += `✓ revisado (sin cambios)\n`;
                            }
                        } catch (e) {
                            output += `⚠ error al parsear\n`;
                        }
                    } else {
                        output += `✓ ok\n`;
                    }
                }

                output += `\n${'='.repeat(50)}\n`;
                if (totalCorregidas > 0) {
                    output += `✅ LIMPEZA EXITOSA!\n`;
                    output += `Se corrigieron: ${totalCorregidas} tareas\n\n`;
                    output += `AHORA:\n`;
                    output += `1. Recarga la página (F5)\n`;
                    output += `2. Verifica que "option" desapareció\n`;
                    msg(`✅ Se corrigieron ${totalCorregidas} tareas. ¡Recarga Tekams!`, 'success');
                } else {
                    output += `✓ No se encontraron datos corruptos\n`;
                    output += `(Ya estaban limpios)\n`;
                    msg('ℹ️ Datos ya están limpios', 'success');
                }

                document.getElementById('resultado').textContent = output;
            } catch (e) {
                msg('❌ Error: ' + e.message, 'error');
                document.getElementById('resultado').textContent = e.message;
            }
        }

        function limpiarObjeto(obj) {
            if (Array.isArray(obj)) {
                return obj.map(item => limpiarObjeto(item));
            } else if (obj !== null && typeof obj === 'object') {
                const resultado = {};
                for (const key in obj) {
                    if (key === 'recurrent' && obj[key] === 'option') {
                        resultado[key] = 'monthly';
                    } else {
                        resultado[key] = limpiarObjeto(obj[key]);
                    }
                }
                return resultado;
            }
            return obj;
        }
    </script>
</body>
</html>
