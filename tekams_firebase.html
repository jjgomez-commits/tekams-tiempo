<script>
// ═══════════════════════════════════════════════════════════════════════════
// AUTENTICACIÓN
// ═══════════════════════════════════════════════════════════════════════════

const AUTH_CONFIG = {
  users: {
    'jjgomez@tekams.com': {password: '1234', isAdmin: true},
    'Paula': {password: '1234', isAdmin: false},
    'Puri': {password: '1234', isAdmin: false},
    'Fran': {password: '1234', isAdmin: false},
    'Antonio': {password: '1234', isAdmin: false},
    'JuanJo': {password: '1234', isAdmin: false},
    'Jon': {password: '1234', isAdmin: false}
  }
};

let authState = {currentUser: null, isAdmin: false, token: null};

function initAuth() {
  const stored = localStorage.getItem('tkm9_auth_firebase');
  if (stored) {
    try {
      const auth = JSON.parse(stored);
      const user = AUTH_CONFIG.users[auth.user];
      if (user && user.password === auth.pass) {
        authState.currentUser = auth.user;
        authState.isAdmin = user.isAdmin;
        authState.token = auth.token;
        showApp();
        return;
      }
    } catch (e) {}
  }
  showAuth();
}

function showAuth() {
  document.getElementById('authOverlay').classList.remove('hidden');
  document.getElementById('userBadge').classList.remove('visible');
  document.getElementById('appContent').classList.remove('visible');
}

function showApp() {
  document.getElementById('authOverlay').classList.add('hidden');
  document.getElementById('userName').textContent = authState.currentUser;
  document.getElementById('adminBadge').classList.toggle('visible', authState.isAdmin);
  document.getElementById('userBadge').classList.add('visible');
  document.getElementById('appContent').classList.add('visible');

  // Inicializar app
  load();
  buildSB();
  renderDash();
}

function handleAuthLogin(e) {
  e.preventDefault();
  const user = document.getElementById('authUser').value.trim();
  const pass = document.getElementById('authPass').value;
  const errorEl = document.getElementById('authError');

  if (!user || !pass) {
    errorEl.textContent = 'Completa todos los campos';
    return;
  }

  const authUser = AUTH_CONFIG.users[user];
  if (!authUser || authUser.password !== pass) {
    errorEl.textContent = 'Usuario o contraseña incorrectos';
    return;
  }

  authState.currentUser = user;
  authState.isAdmin = authUser.isAdmin;
  authState.token = Math.random().toString(36).substr(2, 9);

  try {
    localStorage.setItem('tkm9_auth_firebase', JSON.stringify({
      user: user,
      pass: pass,
      token: authState.token,
      timestamp: Date.now()
    }));
  } catch (e) {}

  errorEl.textContent = '';
  showApp();
}

function handleAuthLogout() {
  if (!confirm('¿Cerrar sesión?')) return;
  localStorage.removeItem('tkm9_auth_firebase');
  authState = {currentUser: null, isAdmin: false, token: null};
  document.getElementById('authUser').value = '';
  document.getElementById('authPass').value = '';
  document.getElementById('authError').textContent = '';
  showAuth();
}

// ═══════════════════════════════════════════════════════════════════════════
// TEKAMS JUMP - SISTEMA DE GESTIÓN
// ═══════════════════════════════════════════════════════════════════════════

const ME = 'Jose';
let TEAM = ['JuanJo','Antonio','Jose','Puri','Paula','Fran','Jon'];

const JUMP = [
  {n:'00',name:'Plan Director',sts:['Plan Director sesión 1 (w01): Formulario de Datos','Plan Director sesión 2 (w02): Formulario de Datos','Cifras de Negocio (w03): Datos del Cliente','Elaborar Plan Director (w03): Estrategia general','Presentar Plan Director (w04): Validar con Cliente','Kickoff Interno (w05): Presentación al Proyecto','Kickoff Empresa (w06): Presentación a Empresa']},
  {n:'01',name:'Presupuesto Anual',sts:['Kickoff (w06)','Conversión Presupuesto (w07)','Proyectar Presupuesto (w07)','Validar Herramienta (w08)','Cierre (w09)']},
  {n:'02',name:'Product Mix',sts:['Kickoff (w07)','Mapeo Taxonomía (w08)','Elaborar Product Mix (w09)','Estrategia Go To Market (w10)','Validar (w11)','Cierre (w12)']},
  {n:'03',name:'Cliente Objetivo',sts:['Kickoff (w08)','Definir ICP (w09)','Elaborar Pain-Gain (w10)','Validar (w11)','Cierre (w12)']},
];

let projs=[], pd={}, curP=null, filt='todas', dashTab='projs', curPTab='tools';
let eTid=null, eStids=null;

function load(){try{if(typeof __D!=='undefined'&&__D&&__D.projs){projs=__D.projs;pd=__D.pd||{};}else{try{var r=localStorage.getItem('tkm9_p');if(r)projs=JSON.parse(r);}catch(e){}try{var r=localStorage.getItem('tkm9_d');if(r)pd=JSON.parse(r);}catch(e){}}}catch(e){}
if(!projs.length)seed();}

function seed(){var mo=function(n){var d=new Date();d.setMonth(d.getMonth()+n);return d.toISOString().split('T')[0];};projs=[{id:'p1',name:'Casaverde',start:mo(-1),end:mo(10),team:['Antonio','Jose','Jon','Puri','Paula']},{id:'p2',name:'Ecoplagas',start:mo(0),end:mo(9),team:['JuanJo','Jose','Fran']}];pd['p1']=mkPD('p1');pd['p2']=mkPD('p2');save();}

function save(){try{localStorage.setItem('tkm9_p',JSON.stringify(projs));localStorage.setItem('tkm9_d',JSON.stringify(pd));localStorage.setItem('tkm9_t',JSON.stringify(TEAM));}catch(e){}}

function mkPD(pid){return{tools:JUMP.map(function(j){return{id:pid+'_'+j.n,num:j.n,name:j.name,person:'',date:'',status:'Pendiente',notes:'',subtasks:j.sts.map(function(s,i){return{id:pid+'_'+j.n+'_'+i,text:s,person:'',date:'',status:'Pendiente',notes:'',done:false}})};});}
function proj(id){return projs.find(function(p){return p.id===(id||curP);})||null;}
function pdata(id){return pd[id||curP]||{tools:[]};}
function tStat(t){var ss=t.subtasks.map(function(s){return s.status;});if(ss.length&&ss.every(function(s){return s==='Completada';}))return'Completada';if(ss.some(function(s){return s==='En curso'||s==='Completada';}))return'En curso';return t.status||'Pendiente';}
function tPct(t){var ss=t.subtasks||[];if(!ss.length)return t.status==='Completada'?100:0;return Math.round(ss.filter(function(s){return s.done;}).length/ss.length*100);}
function ini(n){return String(n||'').split(' ').map(function(w){return w[0];}).join('').slice(0,2).toUpperCase();}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function fmt(d){return d?new Date(d+'T12:00:00').toLocaleDateString('es-ES',{day:'2-digit',month:'short'}):'--';}
function showToast(msg){var t=document.getElementById('tst');if(!t)return;t.textContent=msg;t.classList.add('on');setTimeout(function(){t.classList.remove('on');},2500);}

function buildSB(){var el=document.getElementById('sbProjs');if(!el)return;el.innerHTML='';projs.forEach(function(p){var btn=document.createElement('button');btn.className='pn'+(p.id===curP?' on':'');btn.innerHTML='<span class="pd"></span>'+esc(p.name);btn.addEventListener('click',function(){openProj(p.id);});el.appendChild(btn);});document.getElementById('nbP').textContent=projs.length;}

function showG(sec,btn){document.querySelectorAll('.nav-i').forEach(function(b){b.classList.remove('on');});if(btn)btn.classList.add('on');document.querySelectorAll('.pn').forEach(function(b){b.classList.remove('on');});curP=null;['dash','proj','team','cfg'].forEach(function(k){document.getElementById('s-'+k).classList.toggle('on',k===sec);});if(sec==='dash')renderDash();else if(sec==='team')renderTeam();else if(sec==='cfg')renderCfg();}

function openProj(pid){curP=pid;document.querySelectorAll('.nav-i').forEach(function(b){b.classList.remove('on');});buildSB();['dash','proj','team','cfg'].forEach(function(k){document.getElementById('s-'+k).classList.toggle('on',k==='proj');});showPT(curPTab);renderPH();renderTools();}

function showPT(tab,btn){curPTab=tab;document.querySelectorAll('.pt3').forEach(function(b){b.classList.remove('on');});if(btn)btn.classList.add('on');document.getElementById('pt-tools').style.display=tab==='tools'?'block':'none';document.getElementById('pt-gantt').style.display=tab==='gantt'?'block':'none';}

function showDTab(tab,btn){dashTab=tab;document.querySelectorAll('#s-dash .pt3').forEach(function(b){b.classList.remove('on');});if(btn)btn.classList.add('on');document.getElementById('dashC').style.display=tab==='projs'?'block':'none';document.getElementById('dash-tasks').style.display=tab==='tasks'?'block':'none';if(tab==='projs')renderDashProjs();else renderDashTasks();}

function renderDash(){if(dashTab==='tasks')renderDashTasks();else renderDashProjs();}

function renderDashProjs(){var el=document.getElementById('dashC');if(!el)return;if(!projs.length){el.innerHTML='<div class="emp2"><i class="ti ti-folder-off"></i>No hay proyectos</div>';return;}var h='<div class="dg">';projs.forEach(function(p){var tools=pdata(p.id).tools;var done=tools.filter(function(t){return tStat(t)==='Completada';}).length;var pct=tools.length?Math.round(done/tools.length*100):0;h+='<div class="dc"><div style="margin-bottom:.5rem"><div class="dcn">'+esc(p.name)+'</div></div><div class="dcs"><div class="dc2"><div class="dc2v">'+tools.length+'</div><div class="dc2l">Herram.</div></div><div class="dc2"><div class="dc2v">'+done+'</div><div class="dc2l">Hechas</div></div><div class="dc2"><div class="dc2v">'+pct+'%</div><div class="dc2l">Avance</div></div></div></div>';});h+='</div>';el.innerHTML=h;}

function renderDashTasks(){var el=document.getElementById('dash-tasks');if(!el)return;var h='Sin tareas';el.innerHTML=h;}

function renderTeam(){var allT=projs.flatMap(function(p){return pdata(p.id).tools;});document.getElementById('teamG').innerHTML=TEAM.map(function(name){var mt=allT.filter(function(t){return t.person===name;});return'<div class="mc"><div style="display:flex;gap:8px"><div class="mca">'+ini(name)+'</div><div><div style="font-weight:600">'+esc(name)+'</div><div style="font-size:10px;color:#5A5880">'+mt.length+' herramienta'+(mt.length!==1?'s':'')+'</div></div></div></div>';}).join('');}

function renderCfg(){document.getElementById('cfgC').innerHTML='<div class="cs"><h3>Equipo</h3>'+TEAM.map(function(n,i){return'<div class="ci"><div style="display:flex;align-items:center;gap:8px"><div class="mca" style="width:30px;height:30px;font-size:10px">'+ini(n)+'</div><div>'+esc(n)+'</div></div><button class="btn btn-d" style="padding:4px 8px" onclick="rmMember('+i+')"><i class="ti ti-x"></i></button></div>';}).join('')+'</div><div class="cs"><h3>Proyectos</h3>'+projs.map(function(p){return'<div class="ci"><div>'+esc(p.name)+'</div><div style="display:flex;gap:4px"><button class="btn" style="padding:4px 8px" onclick="openProj(\''+p.id+'\')"><i class="ti ti-arrow-right"></i></button><button class="btn btn-d" style="padding:4px 8px" onclick="delProj(\''+p.id+'\')"><i class="ti ti-trash"></i></button></div></div>';}).join('')+'</div>';}

function addMember(){var n=prompt('Nombre:');if(!n||!n.trim())return;TEAM.push(n.trim());save();renderCfg();}
function rmMember(i){if(!confirm('¿Quitar?'))return;TEAM.splice(i,1);save();renderCfg();}

function renderPH(){var p=proj();if(!p)return;var tools=pdata().tools;var done=tools.filter(function(t){return tStat(t)==='Completada';}).length;var pct=tools.length?Math.round(done/tools.length*100):0;document.getElementById('phCard').innerHTML='<div><div class="phn">'+esc(p.name)+'</div></div><div class="phs"><div class="ph2"><div class="dc2v">'+tools.length+'</div><div class="dc2l">Herram.</div></div><div class="ph2"><div class="dc2v">'+done+'</div><div class="dc2l">Hechas</div></div><div class="ph2"><div class="dc2v">'+pct+'%</div><div class="dc2l">Avance</div></div></div><div style="display:flex;gap:6px"><button class="btn" style="background:rgba(255,255,255,.1);color:#fff;font-size:11px" onclick="editProj(\''+p.id+'\')"><i class="ti ti-edit"></i>Editar</button><button class="btn btn-d" style="font-size:11px" onclick="delProj(\''+p.id+'\')"><i class="ti ti-trash"></i></button></div>';}

function renderTools(){var p=proj();if(!p){document.getElementById('toolList').innerHTML='<div class="emp2">Sin proyecto</div>';return;}var tools=pdata().tools;var con=document.getElementById('toolList');con.innerHTML='';if(!tools.length){con.innerHTML='<div class="emp2">Sin herramientas</div>';return;}tools.forEach(function(tool){var st=tStat(tool),pct=tPct(tool),tid=tool.id;var blk=document.createElement('div');blk.className='tb';var hdr=document.createElement('div');hdr.className='th';hdr.innerHTML='<span class="tn">'+tool.num+'</span><input class="tne" value="'+esc(tool.name)+'" onchange="updTN(\''+tid+'\',this.value)"><span style="flex:1"></span>';hdr.innerHTML+='<button class="ib" onclick="openMoTool(\''+tid+'\')"><i class="ti ti-edit"></i></button><button class="ib" onclick="delTool(\''+tid+'\')"><i class="ti ti-trash"></i></button><div class="mp"><div class="mf'+(pct===100?' full':'')+'" style="width:'+pct+'%"></div></div><i class="ti ti-chevron-down cv"></i>';blk.appendChild(hdr);var stList=document.createElement('div');stList.className='stl';tool.subtasks.forEach(function(s){var row=document.createElement('div');row.className='str';var ck=document.createElement('div');ck.className='ck'+(s.done?' on':'');ck.innerHTML=s.done?'<i class="ti ti-check"></i>':'';ck.addEventListener('click',function(){togSt(tid,s.id);});row.appendChild(ck);var stEd=document.createElement('input');stEd.className='se'+(s.done?' done':'');stEd.value=s.text;stEd.addEventListener('change',function(){updStT(tid,s.id,this.value);});row.appendChild(stEd);row.innerHTML+='<button class="ib" onclick="openMoSt(\''+tid+'\',\''+s.id+'\')"><i class="ti ti-edit"></i></button><button class="ib" onclick="delSt(\''+tid+'\',\''+s.id+'\')"><i class="ti ti-trash"></i></button>';stList.appendChild(row);});var addR=document.createElement('div');addR.className='ar';addR.innerHTML='<input type="text" id="nst_'+tid+'" placeholder="Añadir tarea..."><button class="btn-sm"><i class="ti ti-plus"></i></button>';addR.querySelector('button').addEventListener('click',function(){addSt(tid);});stList.appendChild(addR);blk.appendChild(stList);hdr.addEventListener('click',function(){stList.classList.toggle('open');hdr.querySelector('.cv').classList.toggle('open');});con.appendChild(blk);});}

function addSt(tid){var inp=document.getElementById('nst_'+tid);var text=inp.value.trim();if(!text)return;var t=findTool(tid);if(!t)return;t.subtasks.push({id:tid+'_st'+Date.now(),text:text,person:'',date:'',status:'Pendiente',notes:'',done:false});inp.value='';save();renderTools();}
function addTool(){var pda=pdata();pda.tools.push({id:curP+'_'+pda.tools.length+'_'+Date.now(),num:String(pda.tools.length).padStart(2,'0'),name:'Nueva',person:'',date:'',status:'Pendiente',notes:'',subtasks:[]});save();renderTools();renderPH();}
function delTool(tid){if(!confirm('¿Eliminar?'))return;var pda=pdata();pda.tools=pda.tools.filter(function(t){return t.id!==tid;});save();renderTools();renderPH();}
function delSt(tid,sid){var t=findTool(tid);if(!t)return;t.subtasks=t.subtasks.filter(function(s){return s.id!==sid;});save();renderTools();}
function delProj(pid){if(!confirm('¿Eliminar proyecto?'))return;projs=projs.filter(function(p){return p.id!==pid;});delete pd[pid];save();buildSB();showG('dash',document.querySelector('.nav-i'));}
function togSt(tid,sid){var t=findTool(tid);if(!t)return;var s=t.subtasks.find(function(x){return x.id===sid;});if(!s)return;s.done=!s.done;s.status=s.done?'Completada':'Pendiente';save();renderTools();renderDash();}
function updTN(tid,v){var t=findTool(tid);if(t){t.name=v;save();}}
function updStT(tid,sid,v){var t=findTool(tid);if(!t)return;var s=t.subtasks.find(function(x){return x.id===sid;});if(s){s.text=v;save();}}
function findTool(tid){var dd=pdata();return dd.tools.find(function(t){return t.id===tid;})||null;}

function openMoTool(tid){var t=findTool(tid);if(!t)return;eTid=tid;document.getElementById('moTT').textContent=t.num+'. '+t.name;document.getElementById('eName').value=t.name;document.getElementById('ePers').innerHTML='<option>--</option>'+((proj()&&proj().team)||[]).map(function(n){return'<option'+(t.person===n?' selected':'')+'> '+esc(n)+'</option>';}).join('');document.getElementById('eDate').value=t.date||'';document.getElementById('eStat').value=t.status||'Pendiente';document.getElementById('moTool').classList.add('on');}
function closeMoTool(){document.getElementById('moTool').classList.remove('on');eTid=null;}
function saveToolEdit(){var t=findTool(eTid);if(!t)return;t.name=document.getElementById('eName').value;t.person=document.getElementById('ePers').value;t.date=document.getElementById('eDate').value;t.status=document.getElementById('eStat').value;save();closeMoTool();renderPH();renderTools();}

function openMoSt(tid,sid){var t=findTool(tid);if(!t)return;var s=t.subtasks.find(function(x){return x.id===sid;});if(!s)return;eStids={tid:tid,sid:sid};document.getElementById('stText').value=s.text;document.getElementById('stPers').innerHTML='<option>--</option>'+((proj()&&proj().team)||[]).map(function(n){return'<option'+(s.person===n?' selected':'')+'> '+esc(n)+'</option>';}).join('');document.getElementById('stDate').value=s.date||'';document.getElementById('stStat').value=s.status||'Pendiente';document.getElementById('moSt').classList.add('on');}
function closeMoSt(){document.getElementById('moSt').classList.remove('on');eStids=null;}
function saveStEdit(){if(!eStids)return;var t=findTool(eStids.tid);if(!t)return;var s=t.subtasks.find(function(x){return x.id===eStids.sid;});if(!s)return;s.text=document.getElementById('stText').value;s.person=document.getElementById('stPers').value;s.date=document.getElementById('stDate').value;s.status=document.getElementById('stStat').value;save();closeMoSt();renderTools();renderDash();}

function openPM(){document.getElementById('pName').value='';document.getElementById('pStart').value='';document.getElementById('pEnd').value='';document.getElementById('moPT').textContent='Nuevo proyecto';document.getElementById('pTeamCbs').innerHTML=TEAM.map(function(n){return'<label style="display:flex;align-items:center;gap:6px"><input type="checkbox" value="'+n+'" '+(n===ME?'checked':'')+'><span>'+esc(n)+'</span></label>';}).join('');document.getElementById('moPr').classList.add('on');}
function closePM(){document.getElementById('moPr').classList.remove('on');}
function saveNewP(){var name=document.getElementById('pName').value.trim();if(!name){alert('Nombre requerido');return;}var team=[].slice.call(document.querySelectorAll('#pTeamCbs input:checked')).map(function(i){return i.value;});var p={id:'p'+Date.now(),name:name,start:document.getElementById('pStart').value,end:document.getElementById('pEnd').value,team:team};projs.push(p);pd[p.id]=mkPD(p.id);save();buildSB();closePM();openProj(p.id);}
function editProj(pid){var p=proj(pid);if(!p)return;document.getElementById('pName').value=p.name;document.getElementById('pStart').value=p.start||'';document.getElementById('pEnd').value=p.end||'';document.getElementById('moPT').textContent='Editar proyecto';document.getElementById('pTeamCbs').innerHTML=TEAM.map(function(n){return'<label style="display:flex;align-items:center;gap:6px"><input type="checkbox" value="'+n+'" '+((p.team||[]).indexOf(n)>=0?'checked':'')+'><span>'+esc(n)+'</span></label>';}).join('');document.getElementById('pSaveBtn').onclick=function(){var nm=document.getElementById('pName').value.trim();if(!nm)return;var tm=[].slice.call(document.querySelectorAll('#pTeamCbs input:checked')).map(function(i){return i.value;});p.name=nm;p.start=document.getElementById('pStart').value;p.end=document.getElementById('pEnd').value;p.team=tm;save();buildSB();closePM();renderPH();renderDash();document.getElementById('pSaveBtn').onclick=saveNewP;};document.getElementById('moPr').classList.add('on');}

// Inicializar
window.addEventListener('load',initAuth);
</script>

</body>
