<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tekams - Seguimiento de Proyectos</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
:root {
  --navy: #2A2963;
  --navy-dk: #1E1D4A;
  --accent: #D94F2B;
  --bg: #F2F1F8;
  --txt: #1A1940;
  --txt2: #5A5880;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--txt); min-height: 100vh; }
.auth-overlay { position: fixed; inset: 0; background: linear-gradient(135deg, var(--navy), var(--navy-dk)); display: flex; align-items: center; justify-content: center; z-index: 99999; }
.auth-overlay.hidden { display: none; }
.auth-box { background: #fff; border-radius: 14px; padding: 2.5rem; width: 100%; max-width: 420px; box-shadow: 0 4px 16px rgba(42,41,99,.1); }
.auth-box h1 { font-size: 24px; font-weight: 700; text-align: center; margin-bottom: 8px; }
.auth-box .subtitle { font-size: 12px; color: var(--txt2); text-align: center; margin-bottom: 2rem; }
.auth-field { margin-bottom: 1.25rem; }
.auth-field label { display: block; font-size: 10px; font-weight: 700; color: var(--txt2); text-transform: uppercase; margin-bottom: 6px; }
.auth-field input { width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid rgba(42,41,99,.15); background: var(--bg); font-size: 13px; outline: none; }
.auth-field input:focus { border-color: var(--navy); background: #fff; }
.auth-btn { width: 100%; padding: 11px; border-radius: 10px; border: none; background: var(--navy); color: #fff; font-weight: 600; cursor: pointer; margin-top: 0.5rem; }
.auth-btn:hover { background: #3D3C80; }
.auth-error { color: #C02020; font-size: 11px; margin-bottom: 12px; min-height: 16px; text-align: center; }
.user-badge { position: fixed; top: 1rem; right: 2rem; display: none; align-items: center; gap: 10px; font-size: 11px; background: rgba(255,255,255,.95); padding: 8px 14px; border-radius: 10px; z-index: 99998; }
.user-badge.visible { display: flex; }
.logout-btn { padding: 6px 12px; border-radius: 8px; border: 1px solid rgba(42,41,99,.15); background: #fff; color: var(--txt2); cursor: pointer; font-size: 11px; }
.logout-btn:hover { background: var(--bg); }
#appContent { display: none; }
#appContent.visible { display: block; }
.shell { display: flex; min-height: 100vh; width: 100%; background: #fff; }
.sb { width: 230px; flex-shrink: 0; background: var(--navy-dk); display: flex; flex-direction: column; position: fixed; top: 0; left: 0; bottom: 0; overflow-y: auto; color: #fff; }
.sb-logo { padding: 1.1rem 1.25rem; border-bottom: 1px solid rgba(255,255,255,.08); font-weight: 700; font-size: 16px; }
.sb-sec { padding: .6rem 0 .15rem; }
.sb-lbl { font-size: 9px; font-weight: 700; color: rgba(255,255,255,.28); text-transform: uppercase; padding: 0 1rem; margin-bottom: 3px; }
.nav-i { display: flex; align-items: center; gap: 9px; padding: 7px 1rem; font-size: 12px; color: rgba(255,255,255,.5); cursor: pointer; border: none; background: none; width: 100%; text-align: left; font-family: inherit; }
.nav-i:hover { color: rgba(255,255,255,.8); }
.nav-i.on { color: #fff; background: rgba(255,255,255,.12); }
.pn { width: 100%; padding: 7px 1rem; border: none; background: none; color: rgba(255,255,255,.5); text-align: left; cursor: pointer; font-size: 12px; display: flex; align-items: center; gap: 8px; font-family: inherit; }
.pn:hover { color: rgba(255,255,255,.8); }
.pn.on { color: #fff; background: rgba(255,255,255,.12); font-weight: 600; }
.main { margin-left: 230px; flex: 1; padding: 2rem; overflow-y: auto; }
.sec { display: none; }
.sec.on { display: block; }
h1 { font-size: 24px; font-weight: 700; margin-bottom: 1.5rem; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1.5rem; margin-bottom: 2rem; }
.card { background: linear-gradient(135deg, var(--navy), var(--navy-dk)); border-radius: 12px; padding: 1.5rem; color: #fff; cursor: pointer; margin-bottom: 1rem; }
.card h3 { font-size: 16px; margin-bottom: 1rem; }
.card-stat { font-size: 18px; font-weight: 700; margin-bottom: 4px; }
.card-label { font-size: 10px; opacity: 0.7; }
.btn { padding: 8px 14px; border-radius: 8px; border: 1px solid rgba(42,41,99,.15); background: #fff; color: var(--txt2); cursor: pointer; font-size: 12px; font-family: inherit; }
.btn:hover { background: var(--bg); }
.btn-primary { background: var(--navy); color: #fff; border: none; }
.btn-primary:hover { background: #3D3C80; }
.tool-item { background: #fff; border: 1px solid rgba(42,41,99,.08); border-radius: 10px; margin-bottom: 1rem; overflow: hidden; }
.tool-header { background: #F7F6FC; padding: 12px; font-weight: 600; font-size: 12px; display: flex; align-items: center; gap: 8px; cursor: pointer; user-select: none; }
.tool-num { background: var(--navy); color: #fff; padding: 2px 8px; border-radius: 6px; font-size: 11px; flex-shrink: 0; }
.tool-name { flex: 1; }
.tool-body { display: none; padding: 12px; border-top: 1px solid rgba(42,41,99,.08); }
.tool-body.open { display: block; }
.subtask-row { display: flex; align-items: center; gap: 8px; padding: 8px; border-bottom: 1px solid rgba(42,41,99,.05); font-size: 12px; }
.checkbox { width: 20px; height: 20px; border: 1.5px solid rgba(42,41,99,.25); border-radius: 4px; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; }
.checkbox.done { background: var(--navy); color: #fff; border-color: var(--navy); }
.subtask-text { flex: 1; }
.subtask-text.done { text-decoration: line-through; color: var(--txt2); opacity: 0.6; }
.time-input { width: 60px; padding: 4px 6px; border: 1px solid rgba(42,41,99,.15); border-radius: 6px; font-size: 11px; }
.toast { position: fixed; bottom: 20px; right: 20px; background: var(--navy); color: #fff; padding: 12px 16px; border-radius: 8px; font-size: 12px; z-index: 9998; opacity: 0; transition: opacity .3s; }
.toast.on { opacity: 1; }
</style>
</head>
<body>

<div class="auth-overlay" id="authOverlay">
  <div class="auth-box">
    <h1>Tekams Jump</h1>
    <p class="subtitle">Seguimiento de Proyectos</p>
    <div class="auth-error" id="authError"></div>
    <form onsubmit="handleLogin(event)">
      <div class="auth-field">
        <label>Usuario</label>
        <input type="text" id="user" placeholder="jjgomez@tekams.com" required>
      </div>
      <div class="auth-field">
        <label>Contraseña</label>
        <input type="password" id="pass" placeholder="1234" required>
      </div>
      <button type="submit" class="auth-btn">Iniciar Sesión</button>
    </form>
  </div>
</div>

<div class="user-badge" id="userBadge">
  <span>Usuario: <strong id="userName">--</strong></span>
  <button class="logout-btn" onclick="handleLogout()">Logout</button>
</div>

<div id="appContent">
<div class="shell">
  <div class="sb">
    <div class="sb-logo">TEKAMS</div>
    <div class="sb-sec">
      <div class="sb-lbl">NAVEGACIÓN</div>
      <button class="nav-i on" onclick="showTab('dash')"><i class="ti ti-layout-grid"></i> Dashboard</button>
      <button class="nav-i" onclick="showTab('tiempos')"><i class="ti ti-clock"></i> Control de Tiempos</button>
      <button class="nav-i" onclick="showTab('config')"><i class="ti ti-settings"></i> Configuración</button>
    </div>
    <div class="sb-sec" style="border-top:1px solid rgba(255,255,255,.08)">
      <div class="sb-lbl">PROYECTOS</div>
      <div id="projList"></div>
      <button class="nav-i" style="margin-top:.5rem;border-top:1px solid rgba(255,255,255,.08);padding-top:.75rem" onclick="newProj()"><i class="ti ti-plus"></i> Nuevo</button>
    </div>
  </div>

  <div class="main">
    <div class="sec on" id="dash">
      <h1>Dashboard</h1>
      <div id="dashContent"></div>
    </div>

    <div class="sec" id="tiempos">
      <h1>Control de Tiempos</h1>
      <div id="tiemposContent"></div>
    </div>

    <div class="sec" id="config">
      <h1>Configuración</h1>
      <div id="configContent"></div>
    </div>

    <div id="tst" class="toast"></div>
  </div>
</div>
</div>

<script>
const USERS = {
  'jjgomez@tekams.com': { pass: '1234', admin: true },
  'Paula': { pass: '1234', admin: false },
  'Puri': { pass: '1234', admin: false },
  'Fran': { pass: '1234', admin: false },
  'Antonio': { pass: '1234', admin: false },
  'JuanJo': { pass: '1234', admin: false },
  'Jon': { pass: '1234', admin: false }
};

let user = null;
let projs = [];
let pd = {};
let curP = null;

const TOOLS = [
  { n: '00', name: 'Plan Director', tasks: ['Sesión 1', 'Sesión 2', 'Cifras', 'Plan', 'Presentación', 'Kickoff Interno', 'Kickoff Empresa'] },
  { n: '01', name: 'Presupuesto', tasks: ['Kickoff', 'Conversión', 'Proyección', 'Validación', 'Cierre'] },
  { n: '02', name: 'Product Mix', tasks: ['Kickoff', 'Mapeo', 'Elaboración', 'Go To Market', 'Validación', 'Cierre'] },
  { n: '03', name: 'Cliente Objetivo', tasks: ['Kickoff', 'ICP', 'Pain-Gain', 'Validación', 'Cierre'] }
];

function init() {
  let stored = localStorage.getItem('tkm9_user');
  if (stored) {
    user = stored;
    showApp();
  } else {
    showAuth();
  }
}

function showAuth() {
  document.getElementById('authOverlay').classList.remove('hidden');
  document.getElementById('userBadge').classList.remove('visible');
  document.getElementById('appContent').classList.remove('visible');
}

function showApp() {
  document.getElementById('authOverlay').classList.add('hidden');
  document.getElementById('userName').textContent = user;
  document.getElementById('userBadge').classList.add('visible');
  document.getElementById('appContent').classList.add('visible');
  load();
  render();
}

function handleLogin(e) {
  e.preventDefault();
  let u = document.getElementById('user').value;
  let p = document.getElementById('pass').value;
  if (USERS[u] && USERS[u].pass === p) {
    user = u;
    localStorage.setItem('tkm9_user', u);
    showApp();
  } else {
    document.getElementById('authError').textContent = 'Usuario o contraseña incorrectos';
  }
}

function handleLogout() {
  if (confirm('¿Cerrar sesión?')) {
    user = null;
    localStorage.removeItem('tkm9_user');
    localStorage.removeItem('tkm9_data');
    document.getElementById('user').value = '';
    document.getElementById('pass').value = '';
    document.getElementById('authError').textContent = '';
    showAuth();
  }
}

function load() {
  try {
    let data = localStorage.getItem('tkm9_data');
    if (data) {
      let parsed = JSON.parse(data);
      projs = parsed.projs || [];
      pd = parsed.pd || {};
    }
  } catch (e) {
    console.error('Error loading:', e);
  }
  if (!projs.length) seed();
}

function seed() {
  projs = [
    { id: 'p1', name: 'Casaverde', team: ['Antonio', 'Jose', 'Jon', 'Puri', 'Paula'] },
    { id: 'p2', name: 'Ecoplagas', team: ['JuanJo', 'Jose', 'Fran'] }
  ];
  projs.forEach(p => {
    pd[p.id] = { tools: TOOLS.map(t => ({
      id: p.id + '_' + t.n,
      num: t.n,
      name: t.name,
      person: '',
      status: 'Pendiente',
      subtasks: t.tasks.map((tk, i) => ({
        id: p.id + '_' + t.n + '_' + i,
        text: tk,
        person: '',
        done: false,
        horas: 0
      }))
    })) };
  });
  save();
}

function save() {
  try {
    localStorage.setItem('tkm9_data', JSON.stringify({ projs, pd }));
  } catch (e) {
    console.error('Error saving:', e);
  }
}

function showTab(tab) {
  document.querySelectorAll('.sec').forEach(s => s.classList.remove('on'));
  document.getElementById(tab).classList.add('on');
  render();
}

function render() {
  let active = document.querySelector('.sec.on');
  if (active.id === 'dash') renderDash();
  else if (active.id === 'tiempos') renderTiempos();
  else if (active.id === 'config') renderConfig();
  buildProjList();
}

function buildProjList() {
  let html = '';
  projs.forEach(p => {
    html += `<button class="pn${p.id === curP ? ' on' : ''}" onclick="openProj('${p.id}')">${p.name}</button>`;
  });
  document.getElementById('projList').innerHTML = html;
}

function openProj(pid) {
  curP = pid;
  renderProj();
}

function renderProj() {
  if (!curP) return;
  let p = projs.find(x => x.id === curP);
  let tools = pd[curP].tools;
  let html = `<div><h2 style="font-size:18px;margin-bottom:1.5rem">${p.name}</h2>`;
  tools.forEach(t => {
    let done = t.subtasks.filter(s => s.done).length;
    let pct = t.subtasks.length ? Math.round(done / t.subtasks.length * 100) : 0;
    html += `<div class="tool-item">
      <div class="tool-header" onclick="this.nextElementSibling.classList.toggle('open')">
        <span class="tool-num">${t.num}</span>
        <div style="flex:1;margin-left:8px">${t.name}</div>
        <span style="font-size:10px">${pct}%</span>
      </div>
      <div class="tool-body">
        <select onchange="updTool('${t.id}','person',this.value)" style="width:100%;padding:6px;border-radius:6px;border:1px solid rgba(42,41,99,.15);margin-bottom:8px">
          <option>--</option>
          ${p.team.map(m => `<option ${t.person === m ? 'selected' : ''}>${m}</option>`).join('')}
        </select>`;
    t.subtasks.forEach(s => {
      html += `<div class="subtask-row">
        <div class="checkbox${s.done ? ' done' : ''}" onclick="togTask('${t.id}','${s.id}')">${s.done ? '✓' : ''}</div>
        <div class="subtask-text${s.done ? ' done' : ''}">${s.text}</div>
        <input type="number" min="0" step="0.5" class="time-input" placeholder="h" value="${s.horas || ''}" onchange="updHoras('${t.id}','${s.id}',this.value)">
      </div>`;
    });
    html += `</div></div>`;
  });
  html += `</div>`;
  document.getElementById('dashContent').innerHTML = html;
}

function renderDash() {
  if (curP) {
    renderProj();
    return;
  }
  let html = '<div class="grid">';
  projs.forEach(p => {
    let tools = pd[p.id].tools;
    let done = tools.filter(t => t.subtasks.every(s => s.done)).length;
    html += `<div class="card" onclick="openProj('${p.id}')">
      <h3>${p.name}</h3>
      <div class="card-stat">${tools.length}</div>
      <div class="card-label">Herramientas</div>
      <div class="card-stat" style="margin-top:0.5rem">${done}</div>
      <div class="card-label">Completadas</div>
    </div>`;
  });
  html += '</div>';
  document.getElementById('dashContent').innerHTML = html;
}

function renderTiempos() {
  let html = '';
  projs.forEach(p => {
    let tools = pd[p.id].tools;
    let total = 0;
    tools.forEach(t => {
      t.subtasks.forEach(s => { total += parseFloat(s.horas) || 0; });
    });
    html += `<div class="card" style="background:#fff;color:#000"><h3>${p.name}</h3>`;
    tools.forEach(t => {
      let h = 0;
      t.subtasks.forEach(s => { h += parseFloat(s.horas) || 0; });
      html += `<div style="display:flex;justify-content:space-between;padding:6px 0"><span>${t.num} - ${t.name}</span><strong>${h.toFixed(1)}h</strong></div>`;
    });
    html += `<div style="border-top:1px solid #ddd;padding-top:8px;margin-top:8px;font-weight:700"><div style="display:flex;justify-content:space-between"><span>TOTAL</span><strong>${total.toFixed(1)}h</strong></div></div></div>`;
  });
  document.getElementById('tiemposContent').innerHTML = html;
}

function renderConfig() {
  let html = `<button class="btn btn-primary" onclick="newProj()" style="margin-bottom:1rem"><i class="ti ti-plus"></i> Nuevo Proyecto</button><div>`;
  projs.forEach(p => {
    html += `<div class="card" style="background:#fff;color:#000;display:flex;justify-content:space-between"><strong>${p.name}</strong><button class="btn btn-d" style="padding:4px 8px;font-size:10px" onclick="delProj('${p.id}')"><i class="ti ti-trash"></i></button></div>`;
  });
  html += '</div>';
  document.getElementById('configContent').innerHTML = html;
}

function updTool(tid, field, val) {
  let tool = Object.values(pd).flatMap(p => p.tools).find(t => t.id === tid);
  if (tool) { tool[field] = val; save(); renderProj(); }
}

function updHoras(tid, sid, val) {
  let tool = Object.values(pd).flatMap(p => p.tools).find(t => t.id === tid);
  if (tool) {
    let task = tool.subtasks.find(s => s.id === sid);
    if (task) { task.horas = parseFloat(val) || 0; save(); renderTiempos(); }
  }
}

function togTask(tid, sid) {
  let tool = Object.values(pd).flatMap(p => p.tools).find(t => t.id === tid);
  if (tool) {
    let task = tool.subtasks.find(s => s.id === sid);
    if (task) { task.done = !task.done; save(); renderProj(); }
  }
}

function newProj() {
  let name = prompt('Nombre del proyecto:');
  if (name) {
    let id = 'p' + Date.now();
    projs.push({ id, name, team: [] });
    pd[id] = { tools: TOOLS.map(t => ({
      id: id + '_' + t.n,
      num: t.n,
      name: t.name,
      person: '',
      status: 'Pendiente',
      subtasks: t.tasks.map((tk, i) => ({
        id: id + '_' + t.n + '_' + i,
        text: tk,
        person: '',
        done: false,
        horas: 0
      }))
    })) };
    save();
    render();
  }
}

function delProj(pid) {
  if (confirm('¿Eliminar?')) {
    projs = projs.filter(p => p.id !== pid);
    delete pd[pid];
    save();
    render();
  }
}

window.addEventListener('load', init);
</script>

</body>
</html>
