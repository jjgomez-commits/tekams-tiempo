<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">

<title>Tekams Jump - Seguimiento de Proyectos con Autenticación</title>

<style>
:root{
  --navy:#2A2963;--navy-dk:#1E1D4A;--navy-lt:#3D3C80;
  --accent:#D94F2B;--accent2:#8B3FA8;
  --bg:#F2F1F8;--surf:#FFFFFF;--surf2:#F7F6FC;
  --bdr:rgba(42,41,99,.08);--bdr-md:rgba(42,41,99,.15);
  --txt:#1A1940;--txt2:#5A5880;--txt3:#9896B8;
  --bl:#2A2963;--bl-lt:#ECEAF8;--bl-mid:#B8B5E8;
  --grn:#1A7A4A;--grn-lt:#E6F5EE;
  --amb:#8A5200;--amb-lt:#FDF2DC;
  --red:#C02020;--red-lt:#FCEAEA;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family:'DM Sans',sans-serif; background:#F2F1F8; color:#1A1940; min-height:100vh; }

/* LOGIN OVERLAY */
.auth-overlay{position:fixed;inset:0;background:linear-gradient(135deg,#2A2963,#1E1D4A);display:flex;align-items:center;justify-content:center;z-index:99999;padding:1rem}
.auth-overlay.hidden{display:none}
.auth-box{background:#fff;border-radius:14px;padding:2.5rem;width:100%;max-width:420px;box-shadow:0 4px 16px rgba(42,41,99,.1),0 12px 40px rgba(42,41,99,.08)}
.auth-box h1{font-size:24px;font-weight:700;color:#1A1940;letter-spacing:-.02em;text-align:center;margin-bottom:8px}
.auth-box .subtitle{font-size:12px;color:#5A5880;text-align:center;margin-bottom:2rem}
.auth-field{margin-bottom:1.25rem}
.auth-field label{display:block;font-size:10px;font-weight:700;color:#5A5880;text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px}
.auth-field input{width:100%;padding:10px 12px;border-radius:10px;border:1px solid rgba(42,41,99,.15);background:#F2F1F8;color:#1A1940;font-family:'DM Sans',sans-serif;font-size:13px;outline:none}
.auth-field input:focus{border-color:#2A2963;background:#fff}
.auth-btn{width:100%;padding:11px;border-radius:10px;border:none;background:#2A2963;color:#fff;font-family:'DM Sans',sans-serif;font-weight:600;cursor:pointer;font-size:12px;margin-top:0.5rem}
.auth-btn:hover{background:#3D3C80}
.auth-error{color:#C02020;font-size:11px;margin-bottom:12px;min-height:16px;text-align:center}
.auth-note{font-size:10px;color:#9896B8;margin-top:1.5rem;padding-top:1rem;border-top:1px solid rgba(42,41,99,.08);text-align:center}
.auth-note strong{display:block;color:#5A5880;margin-bottom:4px;font-weight:600}

.user-badge{position:fixed;top:1rem;right:2rem;display:none;align-items:center;gap:10px;font-size:11px;background:rgba(255,255,255,.95);padding:8px 14px;border-radius:10px;box-shadow:0 2px 8px rgba(42,41,99,.15);z-index:99998}
.user-badge.visible{display:flex}
.user-name{font-weight:700;color:#1A1940}
.admin-badge{background:#D94F2B;color:#fff;padding:2px 8px;border-radius:5px;font-size:9px;font-weight:700;text-transform:uppercase;display:none;margin-left:6px}
.admin-badge.visible{display:inline-block}
.logout-btn{padding:6px 12px;border-radius:8px;border:1px solid rgba(42,41,99,.15);background:#fff;color:#5A5880;cursor:pointer;font-size:11px;font-family:'DM Sans',sans-serif;font-weight:500}
.logout-btn:hover{background:#F2F1F8}

#appFrame{display:none;position:fixed;inset:0;width:100%;height:100%;border:none;z-index:9999}
#appFrame.visible{display:block}
</style>

<body>

<!-- AUTENTICACION -->
<div class="auth-overlay" id="authOverlay">
  <div class="auth-box">
    <h1>Tekams Jump</h1>
    <p class="subtitle">Seguimiento de Proyectos</p>
    <div class="auth-error" id="authError"></div>
    <form onsubmit="handleAuthLogin(event)">
      <div class="auth-field">
        <label>Usuario</label>
        <input type="text" id="authUser" placeholder="Email o Nombre" autocomplete="off" required>
      </div>
      <div class="auth-field">
        <label>Contraseña</label>
        <input type="password" id="authPass" placeholder="Contraseña" autocomplete="off" required>
      </div>
      <button type="submit" class="auth-btn">Iniciar Sesión</button>
      <div class="auth-note">
        <strong>Usuarios disponibles:</strong>
        jjgomez@tekams.com (Admin)<br>
        Paula, Puri, Fran, Antonio, JuanJo, Jon<br>
        <strong>Contraseña: 1234</strong>
      </div>
    </form>
  </div>
</div>

<!-- BADGE DE USUARIO -->
<div class="user-badge" id="userBadge">
  <span>Usuario:</span>
  <span class="user-name" id="userName">--</span>
  <span class="admin-badge" id="adminBadge">Admin</span>
  <button class="logout-btn" onclick="handleAuthLogout()">Logout</button>
</div>

<script>
// SISTEMA DE AUTENTICACION
const AUTH_CONFIG = {
  users: {
    'jjgomez@tekams.com': {password: '1234', isAdmin: true},
    'Paula': {password: '1234', isAdmin: false},
    'Puri': {password: '1234', isAdmin: false},
    'Fran': {password: '1234', isAdmin: false},
    'Antonio': {password: '1234', isAdmin: false},
    'JuanJo': {password: '1234', isAdmin: false},
    'Jon': {password: '1234', isAdmin: false}
  }
};

let authState = {
  currentUser: null,
  isAdmin: false,
  token: null
};

function initAuth() {
  const stored = localStorage.getItem('tkm9_auth_firebase');
  if (stored) {
    try {
      const auth = JSON.parse(stored);
      const user = AUTH_CONFIG.users[auth.user];
      if (user && user.password === auth.pass) {
        authState.currentUser = auth.user;
        authState.isAdmin = user.isAdmin;
        authState.token = auth.token;
        showApp();
        return;
      }
    } catch (e) {}
  }
  showAuth();
}

function showAuth() {
  document.getElementById('authOverlay').classList.remove('hidden');
  document.getElementById('userBadge').classList.remove('visible');
  if (document.getElementById('appFrame')) {
    document.getElementById('appFrame').classList.remove('visible');
  }
}

function showApp() {
  document.getElementById('authOverlay').classList.add('hidden');
  document.getElementById('userName').textContent = authState.currentUser;
  document.getElementById('adminBadge').classList.toggle('visible', authState.isAdmin);
  document.getElementById('userBadge').classList.add('visible');

  loadAppContent();
}

function handleAuthLogin(e) {
  e.preventDefault();
  const user = document.getElementById('authUser').value.trim();
  const pass = document.getElementById('authPass').value;
  const errorEl = document.getElementById('authError');

  if (!user || !pass) {
    errorEl.textContent = 'Completa todos los campos';
    return;
  }

  const authUser = AUTH_CONFIG.users[user];
  if (!authUser || authUser.password !== pass) {
    errorEl.textContent = 'Usuario o contraseña incorrectos';
    return;
  }

  authState.currentUser = user;
  authState.isAdmin = authUser.isAdmin;
  authState.token = Math.random().toString(36).substr(2, 9);

  try {
    localStorage.setItem('tkm9_auth_firebase', JSON.stringify({
      user: user,
      pass: pass,
      token: authState.token,
      timestamp: Date.now()
    }));
  } catch (e) {}

  errorEl.textContent = '';
  showApp();
}

function handleAuthLogout() {
  if (!confirm('¿Cerrar sesión?')) return;
  localStorage.removeItem('tkm9_auth_firebase');
  authState = {currentUser: null, isAdmin: false, token: null};
  showAuth();
  document.getElementById('authUser').value = '';
  document.getElementById('authPass').value = '';
  document.getElementById('authError').textContent = '';
}

function loadAppContent() {
  // Crear el contenido del app con el código original de Tekams Jump
  const appHTML = getFullAppHTML();
  document.body.innerHTML = appHTML + document.body.innerHTML.substring(document.body.innerHTML.indexOf('<script'));

  // Re-inicializar componentes
  setTimeout(() => {
    try {
      if (typeof init === 'function') init();
      if (typeof buildSB === 'function') buildSB();
      if (typeof renderDash === 'function') renderDash();
    } catch (e) {
      console.error('Error inicializando app:', e);
    }
  }, 100);
}

function getFullAppHTML() {
  return `
    <div class="shell" style="display:flex;min-height:100vh">
      <div class="sb" id="sb" style="width:230px;flex-shrink:0;background:#1E1D4A;display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;z-index:20;overflow-y:auto">
        <div class="sb-logo" style="padding:1.1rem 1.25rem;border-bottom:1px solid rgba(255,255,255,.08);display:flex;align-items:center">
          <svg width="150" height="28" viewBox="0 0 160 28" fill="none"><text x="10" y="22" fill="white" font-size="18" font-weight="700">TEKAMS</text></svg>
        </div>
        <div class="sb-sec" style="padding:.6rem 0 .15rem">
          <div class="sb-lbl" style="font-size:9px;font-weight:700;color:rgba(255,255,255,.28);text-transform:uppercase;letter-spacing:.09em;padding:0 1rem;margin-bottom:3px">NAVEGACIÓN</div>
          <button class="nav-i on" onclick="showG('dash',this)" style="display:flex;align-items:center;gap:9px;padding:7px 1rem;font-size:12px;color:rgba(255,255,255,.5);cursor:pointer;border:none;background:none;width:100%;text-align:left;transition:all .15s;font-family:'DM Sans',sans-serif"><i class="ti ti-layout-grid"></i> Dashboard</button>
          <button class="nav-i" onclick="showG('projs',this)" style="display:flex;align-items:center;gap:9px;padding:7px 1rem;font-size:12px;color:rgba(255,255,255,.5);cursor:pointer;border:none;background:none;width:100%;text-align:left;transition:all .15s;font-family:'DM Sans',sans-serif"><i class="ti ti-briefcase"></i> Proyectos</button>
          <button class="nav-i" onclick="showG('gantt',this)" style="display:flex;align-items:center;gap:9px;padding:7px 1rem;font-size:12px;color:rgba(255,255,255,.5);cursor:pointer;border:none;background:none;width:100%;text-align:left;transition:all .15s;font-family:'DM Sans',sans-serif"><i class="ti ti-chart-gantt"></i> Gantt</button>
          <button class="nav-i" onclick="showG('team',this)" style="display:flex;align-items:center;gap:9px;padding:7px 1rem;font-size:12px;color:rgba(255,255,255,.5);cursor:pointer;border:none;background:none;width:100%;text-align:left;transition:all .15s;font-family:'DM Sans',sans-serif"><i class="ti ti-users"></i> Equipo</button>
          <button class="nav-i" onclick="showG('cfg',this)" style="display:flex;align-items:center;gap:9px;padding:7px 1rem;font-size:12px;color:rgba(255,255,255,.5);cursor:pointer;border:none;background:none;width:100%;text-align:left;transition:all .15s;font-family:'DM Sans',sans-serif"><i class="ti ti-settings"></i> Configuración</button>
        </div>
      </div>
      <div class="main" style="margin-left:230px;flex:1;padding:1.75rem 2.25rem;min-height:100vh">
        <div class="sec on" id="secDash"></div>
        <div class="sec" id="secProjs"></div>
        <div class="sec" id="secGantt"></div>
        <div class="sec" id="secTeam"></div>
        <div class="sec" id="secCfg"></div>
        <div id="tst" class="toast"></div>
      </div>
    </div>
  `;
}

// Inicializar
window.addEventListener('load', initAuth);
</script>
